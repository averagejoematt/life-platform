title = "life-platform gitleaks allowlist"

# #1659 — secret-scanning CI gate. This file EXTENDS gitleaks' built-in
# default ruleset (does not replace it) and adds a small, narrow allowlist
# for the false positives actually observed running `gitleaks detect`
# against the current tree on 2026-07-21. Every entry below is scoped by
# BOTH file path AND the exact literal string (condition = "AND"), so it
# can only suppress that one known-safe value in that one known file — not
# any other secret that happens to share a rule ID.
#
# Do NOT add speculative entries. A new allowlist entry requires the same
# bar: run gitleaks locally, confirm the finding is not a real credential,
# and record why here.
#
# NOTE: the CI gate itself (.github/workflows/secret-scan.yml) scans only
# the commit range introduced by a PR (--log-opts base..head), not the full
# repository history and not the full current tree — see that file's header
# for why (this repo was PUBLIC before 2026-07-13 and its history/tree carry
# pre-existing strings that would otherwise red every future PR forever).
# This allowlist is defense-in-depth for the case where a future PR's diff
# happens to re-touch one of these lines (e.g. edits a neighboring line and
# pulls the old one into the diff context).

[extend]
useDefault = true

[[allowlists]]
description = "tests/test_ritual_log_endpoint.py + tests/test_intake_response.py — hardcoded HMAC signing secret for the ritual-log forgery-guard test suite (#769/#1405). Deliberately fake, self-describing name, used only to sign test tokens in-process; never a live credential."
condition = "AND"
regexTarget = "match"
regexes = ['''test-ritual-secret-0123456789''']
paths = [
  '''tests/test_ritual_log_endpoint\.py''',
  '''tests/test_intake_response\.py''',
]

[[allowlists]]
description = "deploy/archive/20260314/r8_p0_verify.sh — deliberately invalid bearer token used to assert the webhook returns 401 on bad auth (Architecture Review #8 P0 check). Not a real token."
condition = "AND"
regexTarget = "match"
regexes = ['''INVALID_TOKEN_R8_TEST''']
paths = ['''deploy/archive/20260314/r8_p0_verify\.sh''']

[[allowlists]]
description = "docs/DECISIONS.md — the MacroFactor reverse-engineering ADR. This is the Firebase WEB API key for the sbs-diet-app project, already published in this same ADR as intentionally embeddable: Firebase web keys are not secret by Google's own security model (protection is Auth rules + bundle-ID validation, not key secrecy). Allowlisting here does not increase exposure — the value is already public in-repo and upstream."
condition = "AND"
regexTarget = "match"
regexes = ['''AIzaSyA17Uwy37irVEQSwz6PIyX3wnkHrDBeleA''']
paths = ['''docs/DECISIONS\.md''']

[[allowlists]]
# #4088 — found 2026-09-23 by the secret-scan gate on PR #4126
# (https://github.com/averagejoematt/life-platform/actions/runs/35888631389): two
# generic-api-key findings at commit 806b227bd, tests/test_site_api_derived_phase_4088.py
# lines 70 and 166 — both the tuple `("site_api_autonomic.py", "handle_zone2_breakdown", ...)`.
# Not a credential: `handle_zone2_breakdown` is the name of the /api/zone2 handler in
# lambdas/web/site_api_autonomic.py, and the rule fired because the `api` inside the module
# name `site_api_autonomic` sits one `", "` before a 22-char token above the entropy floor.
# gitleaks is not installed locally; the finding's file/line/commit were read from that
# CI log (the secret is REDACTED there) and the line content from `git show 806b227bd`. The
# test file was reshaped in the follow-up commit (filename LAST in each key tuple, so
# the `api...` literal is followed by `)` and cannot match); this entry exists only
# because the gate scans the PR commit RANGE, which still carries 806b227bd.
description = "tests/test_site_api_derived_phase_4088.py — the handler name handle_zone2_breakdown in a (file, function) ruling tuple, matched as generic-api-key via the `api` in `site_api_autonomic.py` (#4088). A function name, not a credential."
condition = "AND"
regexTarget = "match"
regexes = ['''handle_zone2_breakdown''']
paths = ['''tests/test_site_api_derived_phase_4088\.py''']

# ── #3620 — the platform's OWN bearer shapes ─────────────────────────────────
# GitHub's validity checks and non-provider patterns are not offered on a
# user-owned repo (#3606 item 3), so gitleaks' default ruleset is the whole
# detector here — and it knows AWS keys and GitHub PATs, not `lp_…`. Four
# platform-minted credentials were therefore invisible to every scanner in the
# pipeline. Each rule below has a positive control under tests/fixtures/gitleaks/
# proving the pattern MATCHES a planted token (see the allowlist block after the
# rules, which is what stops those controls redding the gate on every PR that
# touches them), and tests/test_gitleaks_rules_3620.py re-runs every rule's
# regex against its own fixture so the controls hold even where the gitleaks
# binary is not installed.

[[rules]]
id = "life-platform-mcp-bearer"
description = "MCP remote bearer (lp_<sha256>) — mcp/handler.py::_get_bearer_token"
regex = '''\blp_[0-9a-f]{64}\b'''
keywords = ["lp_"]

[[rules]]
id = "life-platform-mcp-session-bearer"
description = "MCP 24h session bearer (lps_…) — minted by /token, #893-A"
regex = '''\blps_[A-Za-z0-9_\-]{20,}'''
keywords = ["lps_"]

[[rules]]
id = "life-platform-hae-ingest-bearer"
description = "Health Auto Export ingest bearer (life-platform/ingestion-keys) — no prefix, so keyed on the assignment context"
regex = '''(?i)\b(?:hae|health_auto_export|ingestion)[_-]?(?:api[_-]?)?(?:key|token|secret)\b\s*[:=]\s*["']([A-Za-z0-9_\-]{24,})["']'''
secretGroup = 1
keywords = ["hae", "health_auto_export", "ingestion"]

[[rules]]
id = "life-platform-telegram-webhook-secret"
description = "Telegram X-Telegram-Bot-Api-Secret-Token value (life-platform/telegram::webhook_secret)"
regex = '''(?i)\b(?:webhook_secret|telegram_secret_token|x[_-]telegram[_-]bot[_-]api[_-]secret[_-]token)\b\s*[:=]\s*["']([A-Za-z0-9_\-]{16,})["']'''
secretGroup = 1
keywords = ["webhook_secret", "telegram_secret_token", "secret-token"]

[[rules]]
id = "life-platform-site-api-origin-secret"
description = "SITE_API_ORIGIN_SECRET / x-amj-origin gate value (life-platform/site-api-origin-secret)"
regex = '''(?i)\b(?:site_api_origin_secret|x[_-]amj[_-]origin)\b\s*[:=]\s*["']([A-Za-z0-9_\-]{12,})["']'''
secretGroup = 1
keywords = ["site_api_origin_secret", "x-amj-origin", "x_amj_origin"]

[[allowlists]]
description = "tests/fixtures/gitleaks/** — the POSITIVE CONTROLS for the five rules above. Each file plants a syntactically real token of the shape its rule hunts, so that the rule can be shown to fire (by `gitleaks detect --source tests/fixtures/gitleaks --no-git`, and by tests/test_gitleaks_rules_3620.py where the binary is absent). None is a live credential: every value is locally generated, self-describing, and matched here by path so the gate does not red on the controls that prove it works."
paths = ['''tests/fixtures/gitleaks/.*''']
