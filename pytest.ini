[pytest]
# V2 P4.13 (2026-05-17): register custom marks to silence PytestUnknownMarkWarning
# and enable `pytest -m 'not integration'` for fast unit-only cycles.
markers =
    integration: AWS-integration tests (network calls; ~24s); run separately in CI
    deploy_critical: deploy-gating structural/contract tests (#416, ADR-117). The fast
        offline subset that gates the `deploy` job — a failure means the deploy artifact
        or its wiring is broken, or a core honesty/safety contract the running system
        depends on is violated. Inclusion criteria live in docs/CONVENTIONS.md
        ("Deploy-critical test lane"). The exhaustive suite still runs on every push
        (job `test`) and still reds main; it just no longer skips deploy + the
        reader-facing visual-QA gate.
    serial: a test that MUTATES THE CHECKOUT and therefore cannot run in the
        parallel pass (#3025). The suite's only genuinely shared mutable state is the
        working tree: dozens of tests rglob `lambdas/` or the repo root, so a test that
        plants a file there races every one of them. Most such tests can be fixed at the
        source by pointing them at a private temp dir — `tests/test_rate_limit_identity_1221.py`
        was. A few CANNOT: `test_the_widened_scan_actually_covers_each_root` exists to
        prove each REAL scan root is wired, so a temp dir would make it vacuous. Those
        are marked `serial`, deselected from `-n auto`, and run afterwards in one
        process. The registry + its guard live in tests/test_suite_parallel_safety_3025.py.
    premerge: the PRE-MERGE lane (#2258). Applied automatically by
        tests/conftest.py::pytest_collection_modifyitems — never hand-written on a
        test — to every `tests/*_behavior.py` test plus everything already marked
        deploy_critical. Exists because the pre-merge lane used to be a strict
        SUBSET of the post-merge one, so a PR could be green pre-merge and red main
        on landing (three times in 24h on 2026-08-08). Both .github/workflows/
        pr-checks.yml and ci-test.yml reference this one marker name;
        tests/test_premerge_lane.py fails if they ever stop agreeing.

# Suppress noisy deprecation warnings from third-party libs (typeguard / logfire pull from python3.14 SDK)
filterwarnings =
    ignore::DeprecationWarning
