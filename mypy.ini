[mypy]
# Enforced (BLOCKING in CI) on the clean-module set — tests/test_mypy_clean_modules.py
# + the ci-lint.yml "Mypy gate (ENFORCED — clean-module set, ADR-080)" step.
#
# Since #1656's whole-surface step the clean-module set IS the whole first-party Python
# surface: every package under lambdas/ plus mcp/ (350 modules), with an EMPTY denylist
# and no per-module `ignore_errors` sections. There is no longer a curated subset — a
# green run under this config covers all of it.
python_version = 3.12
warn_unused_ignores = True
warn_return_any = False
warn_unused_configs = True
no_implicit_optional = True
check_untyped_defs = False
# Disable list — being emptied incrementally (#1656, part of eng-excellence #1648).
# Enforced clean on the clean-module set + its full import closure. Codes now ENABLED
# (was 14, now 10): no-redef, var-annotated, name-defined, type-arg, union-attr,
# list-item, has-type, plus the #1656 mcp/ ratchet step's three: return, attr-defined,
# index. `var-annotated` was cleared by annotating empty-container declarations
# (element types only, no runtime change). `attr-defined`/`index` were cleared by
# annotating the heterogeneous engine registries (SOURCE_REGISTRY, mcp.registry.TOOLS,
# summary/results dicts) as dict[str, dict[str, Any]] / dict[str, Any], correcting
# compute_cross_pillar_effects's return type (declared dict, actually a tuple), and a
# single guarded `# type: ignore[index]`. `return` was cleared by three
# `# type: ignore[return]` at retry-loop tails whose fall-through is provably
# unreachable (loop always returns or re-raises on the final attempt).
#
# Still disabled — each a documented next tranche, not silently kept. Measured
# 2026-08-06 against the full 350-module surface (mypy 2.3.0, one code enabled at a
# time; the combined run is 1,047 because enabling one code exposes sites the others
# were masking):
#   assignment(256)  arg-type(44)  return-value(31)  operator(36)
#   check_untyped_defs=True(330)   warn_return_any=True(159)
# These are structural mismatches, not scoped annotations: `operator`/`return-value`
# are concentrated in health/scoring_engine.py + health/character_engine.py, where the
# honest fix is correcting latent-Optional signatures (`-> tuple[int | None, ...]` that
# actually returns a float) and letting that ripple to callers. That is behavior-
# adjacent surgery on the scoring path and belongs in its own reviewable PR, not
# bundled with a clean-set expansion.
#
# #2638 — RETAINED, WITH THE COST MEASURED AND OWNED. The counts above are over the whole
# tree; the gate only ever runs the CLEAN SET, so the decision-relevant number is what
# each code surfaces THERE. Measured 2026-08-15 over 436 clean-set files
# (`python3 scripts/mypy_disable_cost.py`):
#
#     assignment    285 errors in 144 files
#     arg-type       60 errors in  41 files
#     return-value   32 errors in  11 files   <- ENABLED 2026-08-15, see below
#     operator       38 errors in  14 files
#
# 415 in total, so this is a tranche, not a flag flip — which is what the numbers were
# gathered to decide.
#
# #2638 TRANCHE 1 LANDED (2026-08-15): `return-value` is ENABLED and the list is down to
# three. All 32 sites were fixed and the run is now `Success: no issues found in 436
# source files`. The prediction above — "behavior-adjacent surgery on the scoring path"
# — did NOT hold, and the reason is worth keeping: every one of the 32 was an ANNOTATION
# that under-described already-correct code, not code that needed changing. Nothing about
# any returned VALUE moved. The clearest cases:
#   · `load_character_config` was annotated `-> dict` and returns None when S3 is
#     unreadable with no warm cache — which its caller ALREADY handles with
#     `if not config: raise RuntimeError(...)`, pinned by a test. Contract right,
#     annotation wrong.
#   · `check_mcp`/`check_anthropic` return None for "skipped", which the docstring
#     states outright ("skip — not a failure"). Coercing those to False to satisfy the
#     annotation would have turned a skip into a failure — the one place this tranche
#     could have caused a real behaviour change, avoided by widening the type instead.
#   · `compute_day_grade` was annotated as a 3-tuple and returns a 4-tuple: a caller
#     trusting the signature would have raised ValueError on unpack.
#   · three `build_*_summary` functions were annotated `-> dict[str, Any]` and return
#     plain strings; `call_training_nutrition_coach` was annotated `-> str` and returns
#     a dict its only caller already treats as one.
# Remaining tranches, still measured, still owned: assignment / arg-type / operator.
#
# Tracked on #2638. It was tracked on #1656, which is CLOSED with this list non-empty —
# so a reader seeing a closed "empty the disable list" issue reasonably concluded the list
# was empty. The residual now has an owner; that mismatch was itself the #2578 defect
# class at tracker level, a thing that reads as done and is not.
#
# What "mypy passed" means here, stated because the name overclaims: the gate is genuinely
# armed (`name-defined` and `attr-defined` were mutation-proven to red it) for a NARROWER
# class than full strictness. ADR-107's "mypy tier-2" names a FILE-SCOPE ratchet — which
# modules are checked — not an error-code one. Both are partial, and neither implies the
# other.
disable_error_code = assignment, arg-type, operator

# Skip noisy bundled-with-Lambda modules and tests for now.
exclude = (?x)(
    ^cdk/
    | ^tests/
    | ^deploy/
    | ^\.venv/
  )

# Third-party stubs we don't need to resolve.
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

# ── Layer-shipped third-party deps with no stubs (#1656 whole-surface step) ───
# These four ship into their Lambda's own requirements/*.txt (or an offline layer)
# and are NOT installed in CI's lint venv, so mypy cannot resolve them from the
# repo root. Unresolvable-but-real 3rd-party imports are a stub gap, not a type
# gap in our code — the honest mechanism is ignore_missing_imports scoped to the
# module, never a blanket ignore on OUR module. Each is a genuine external lib:
#   lameenc       — MP3 encoder used by ai/audio_encode.py (panelcast compression)
#   garth / garminconnect — Garmin clients used by ingestion/garmin_lambda.py
#   openpyxl      — xlsx reader used by ingestion/measurements_ingestion_lambda.py
[mypy-lameenc]
ignore_missing_imports = True

[mypy-garth]
ignore_missing_imports = True

# garth.exc — the #2182 adapter's error-translation seam; garth is layer-shipped.
[mypy-garth.*]
ignore_missing_imports = True

[mypy-garminconnect]
ignore_missing_imports = True

[mypy-openpyxl]
ignore_missing_imports = True

# Pillow ships no bundled type stubs and we don't install types-Pillow;
# og_image_lambda.py/og_moments.py (#419 tier-2 web/ set) use PIL for
# card rendering. Known false positive, not a real type gap.
[mypy-PIL.*]
ignore_missing_imports = True

# Suppress missing imports for sibling lambdas/ modules that aren't typed yet.
[mypy-ai.ai_output_validator]
ignore_missing_imports = True

[mypy-coach.board_loader]
ignore_missing_imports = True

# grounding_guard lives in lambdas/intelligence/ (flat-copied into the layer by
# build_layer.sh) — the FLAT name is unresolvable from the repo root either way.
# ADR-104. (The package name `intelligence.grounding_guard` resolves normally now
# that lambdas/intelligence/ is in the clean set, so it needs no section.)
[mypy-grounding_guard]
ignore_missing_imports = True

[mypy-intelligence.grounding_guard]
ignore_missing_imports = True

# #1968: the same shape one module over. `night_scope` and `grounded_generation` each
# carry the dual package/flat import fallback (the bundle stages lambdas/ at the zip
# root, the layer flattens it), and the FLAT arm of each is unresolvable from the repo
# root by construction.
[mypy-night_scope]
ignore_missing_imports = True

# #2056: same shape again — `behavior_logs` is imported by `grounded_generation` through
# the dual package/flat fallback, and the FLAT arm is unresolvable from the repo root.
[mypy-behavior_logs]
ignore_missing_imports = True

[mypy-grounded_generation]
ignore_missing_imports = True

# #3086: same shape again — `regen_discard_telemetry` is imported by `grounded_generation`
# through the dual package/flat fallback, and the FLAT arm is unresolvable from the repo root.
[mypy-regen_discard_telemetry]
ignore_missing_imports = True

# #3154: same shape again — `baseline_freshness` is imported by `grounded_generation`
# through the dual package/flat fallback, and the FLAT arm is unresolvable from the repo root.
[mypy-baseline_freshness]
ignore_missing_imports = True

# ai_review_pack_lambda lives in lambdas/emails/ (flat-copied into the MCP bundle,
# resolved via conftest sys.path in tests) — unresolvable from the repo root. Imported
# by coach_correction_resolver's deferred-import helper (#1656 mcp/ clean-set step).
[mypy-ai_review_pack_lambda]
ignore_missing_imports = True

# ── No per-module `ignore_errors` sections remain (#1656 whole-surface step) ───
# There used to be eight, each suppressing a first-party module's own errors so the
# rest of the clean set could be checked around it (common.platform_logger,
# training.training_notes, web.site_api_{data,nutrition,meals,training,physical,mind}).
# All eight were fixed instead of suppressed, so every first-party module is now
# judged on its own merits. A new `ignore_errors` section is a clean-set regression
# and belongs in review, not in this file — see tests/mypy_clean_set.py::DIRTY.
