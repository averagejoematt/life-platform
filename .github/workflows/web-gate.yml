# v9 web gate (#5530, epic #5529) — the pre-merge gate for the static build in web/.
#
# Deliberately separate from v4-gate.yml (which guards the site/ tree) and from ci-cd.yml:
# it has NO AWS access and NO deploy capability. It builds the preview from the committed
# FIXTURE snapshot (offline, deterministic — no live data, so it cannot flake on a day's
# numbers and cannot leak one), then holds the five Phase 0 exit criteria it can measure:
#
#   1. the build is reproducible (two builds, one tree hash);
#   2. the schemas validate (the build itself, plus tests/test_web_publication_snapshot_5530.py);
#   3. a held/private object cannot enter the build — proven by MUTATION, not assumed:
#      a poisoned snapshot MUST fail `astro build`, and the output is scanned for the
#      fixture sentinels;
#   4. the relationship index resolves — a dangling edge MUST fail the build;
#   5. the existing QA architecture reaches the output: the Playwright render gate at
#      390/1280 with axe, the same harness family as qa/pr_render_gate.py and
#      tests/kit_page_gate.py, with its own mutation control.
#
# The live-snapshot preview deploy to /next/v9/ is a different workflow
# (web-preview-deploy.yml) and runs only after a merge to main.

name: v9 web gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/publish_snapshot.py'
      - 'tests/test_web_publication_snapshot_5530.py'
      - 'tests/web_preview_gate.py'
      - '.github/workflows/web-gate.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/publish_snapshot.py'
      - 'tests/web_preview_gate.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-gate:
    name: Build from fixtures · schema + visibility + edge mutations · render gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the build toolchain (lockfile, no scripts)
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Snapshot contract tests
        run: python3 -m pytest tests/test_web_publication_snapshot_5530.py -q -p no:randomly

      - name: Export the fixture snapshot
        run: python3 scripts/publish_snapshot.py --mode fixture --out web/content/snapshot

      - name: Build the preview twice and compare tree hashes (exit criterion 1)
        working-directory: web
        run: |
          npm run build:preview
          (cd dist && find . -type f | sort | xargs sha256sum | sha256sum) > /tmp/build1.sha
          npm run build:preview
          (cd dist && find . -type f | sort | xargs sha256sum | sha256sum) > /tmp/build2.sha
          diff /tmp/build1.sha /tmp/build2.sha && echo "reproducible: $(cat /tmp/build1.sha)"

      - name: Unit tests for the index and formatters
        working-directory: web
        run: npm test

      - name: Mutation — a held object in the snapshot MUST fail the build (exit criterion 3)
        working-directory: web
        run: |
          cp content/snapshot/chapters.json /tmp/chapters.json
          python3 - <<'PY'
          import json
          p = "content/snapshot/chapters.json"; d = json.load(open(p)); d[0]["visibility"] = "held"; json.dump(d, open(p, "w"))
          PY
          if npm run build:preview > /tmp/poison.log 2>&1; then echo "::error::a held object built — the visibility gate is blind"; exit 1; fi
          grep -q 'expected "public"' /tmp/poison.log && echo "held object refused by the schema"
          cp /tmp/chapters.json content/snapshot/chapters.json

      - name: Mutation — a dangling edge MUST fail the build (exit criterion 4)
        working-directory: web
        run: |
          cp content/snapshot/predictions.json /tmp/predictions.json
          python3 - <<'PY'
          import json
          p = "content/snapshot/predictions.json"; d = json.load(open(p)); d[0]["edges"].append({"type": "metric", "id": "does_not_exist"}); json.dump(d, open(p, "w"))
          PY
          if npm run build:preview > /tmp/dangle.log 2>&1; then echo "::error::a dangling edge built — the index is blind"; exit 1; fi
          grep -q "dangling edge" /tmp/dangle.log && echo "dangling edge refused"
          cp /tmp/predictions.json content/snapshot/predictions.json
          npm run build:preview

      - name: Output scan — no sentinel, no inline script, noindex on every page
        working-directory: web
        run: |
          ! grep -rl "SENTINEL\|DO-NOT-PUBLISH" dist || { echo "::error::sentinel in dist"; exit 1; }
          if grep -rhoE "<script\b[^>]*>" dist | grep -v 'src=' ; then echo "::error::inline script"; exit 1; fi
          for f in $(find dist -name index.html); do grep -q 'name="robots" content="noindex' "$f" || { echo "::error::$f lacks noindex"; exit 1; }; done
          echo "scan clean: $(find dist -name index.html | wc -l) pages"

      - uses: ./.github/actions/playwright-browser
        with:
          browser: chromium

      - name: Render gate at 390 + 1280 with axe (exit criterion 5)
        run: python3 tests/web_preview_gate.py --dist web/dist --base /next/v9/ --out /tmp/web-gate

      - name: Upload the build and the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v9-preview-${{ github.sha }}
          path: |
            web/dist
            /tmp/web-gate
          retention-days: 14
