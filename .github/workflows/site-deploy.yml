# Site deploy on merge (#750) — kill the manual-deploy drift class at the root.
#
# A push to main touching site/ deploys the public site THROUGH CI from the merged
# main tree, then gates it with the smoke + visual/AI-QA nets and auto-rolls-back
# on a red. Hand-deploys from a laptop checkout — the documented root of the
# squash-drift/clobber class (R21 cicd-02) — are no longer the default path.
#
# Why a SEPARATE workflow (not a job in ci-cd.yml):
#   • ci-cd.yml's deploy job sits behind `environment: production` (manual
#     approval). A site deploy must NOT wait on that gate — "merged but not
#     deployed" is exactly the drift class this kills. The site deploy is
#     low-blast-radius (static files, canonical rollback script, no Lambda/IAM
#     surface), so it ships on merge and relies on the post-deploy gates +
#     auto-rollback instead of a human click.
#   • ci-cd.yml's trigger paths never included site/**, so site-only pushes ran
#     NO pipeline at all. Adding site/** there would drag every site push through
#     lint/test/plan/cdk-diff — none of which touch the static site.
#   • Precedent: v4-gate.yml and visual-qa.yml are already deliberately separate
#     workflows for the same reason (different trust + dependency profile).
#   The #393 site-deploy steps inside ci-cd.yml's deploy job (and its
#   rollback-site-on-failure job) moved HERE — single owner, no double deploy.
#
# Deploy path is the CANONICAL one (do not reimplement syncing here):
#   deploy/deploy_site.sh → deploy/sync_site_to_s3.sh — clobber guard, rss/sitemap/
#   shell regeneration, PII surface guard (fail-closed), JS parse gate, full-graph
#   content-hashing, build stamp (/version.json == merged SHA), cache headers,
#   CloudFront invalidation. It never runs `aws s3 sync --delete` at bucket root
#   (safe_sync semantics); the only extra step here is the explicit fonts sync
#   (sync_site_to_s3.sh excludes assets/* non-CSS/JS by design — see CLAUDE.md).
#
# Rollback: smoke OR visual-QA red after a successful deploy → deploy/
# rollback_site.sh HEAD~1 (re-hash + re-stamp version.json to the prior build,
# re-invalidate) + SNS alert — SCOPE-CHECKED on both legs (#3352 visual /
# #3395 smoke): the rollback fires only when a failed check's surface is
# site/**-reachable; a data-plane or edge-config red files a #1447 issue
# instead of reverting innocent content. Assumes squash-merge (one commit per
# PR) so the previous good site == HEAD~1; for a multi-commit push roll back
# manually: bash deploy/rollback_site.sh <ref>.
#
# First watched run: merge of this PR (it touches .github/workflows/site-deploy.yml,
# which is in its own paths filter, so the workflow exercises itself end-to-end).

name: Site deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'config/**'                           # #2019 — bucket-root config/ twins deploy from here too
      - 'deploy/config_twin_sync.py'
      - 'deploy/config_twin_registry.py'
      - '.github/workflows/site-deploy.yml'   # workflow edits must exercise themselves
  workflow_dispatch:        # manual re-deploy of the current main tree (e.g. after a generated/ data fix)
    inputs:
      # #3352 box 3 — the LIVE proof of the rollback scope check. Injects ONE synthetic
      # failed page of the chosen surface into the visual-QA sweep, so the run goes red
      # on a known class against the real site with a harmless same-tree redeploy, and
      # `rollback-site-on-failure` can be watched DECLINING by name. The #3200 lesson:
      # a fail-closed path with green unit tests can be entirely non-functional.
      #
      # Reachable ONLY from workflow_dispatch — the env var below is set from
      # `github.event.inputs.*`, which is empty on a push, and the guard is pinned in
      # tests/test_site_deploy_workflow.py so a push can never inject.
      qa_inject_failure:
        description: 'Inject one synthetic visual-QA failure of this surface (live proof of the #3352 rollback scope check)'
        required: false
        default: none
        type: choice
        options: [none, api, deploy-script]
      # #3395 box 3 — the smoke leg's twin of the input above: one synthetic /api-class
      # smoke failure, so `rollback-site-on-failure` can be watched DECLINING on a
      # data-plane red the smoke gate raised (the 2026-09-01 P3 shape). Same guard:
      # reachable ONLY from workflow_dispatch, pinned in
      # tests/test_smoke_rollback_scope_3395.py.
      smoke_inject_failure:
        description: 'Inject one synthetic /api-class SMOKE failure (live proof of the #3395 rollback scope check)'
        required: false
        default: none
        type: choice
        options: [none, api]

# Never two site syncs racing (each pushes the whole tree + invalidates).
# cancel-in-progress=false: a sync mid-flight should complete, not be killed halfway.
concurrency:
  group: site-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: "205930651321"
  SNS_TOPIC_ARN: arn:aws:sns:us-west-2:205930651321:life-platform-alerts-digest

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

jobs:
  # ════════════════════════════════════════════════════════════════
  # Job 1: Deploy the site from the merged main tree
  # ════════════════════════════════════════════════════════════════
  deploy-site:
    name: Deploy public site
    runs-on: ubuntu-latest
    outputs:
      superseded: ${{ steps.supersede.outputs.superseded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Queued runs can be for a commit that is no longer main's tip (a newer
      # site/ merge landed while this run waited on the concurrency group).
      # sync_site_to_s3.sh's clobber guard would refuse that deploy anyway —
      # correctly, but as a red run + SNS alert. Detect it up front and skip
      # cleanly instead: the newer commit has its own queued run that deploys
      # a strict superset of this one.
      #
      # #1907 — "the newer commit has its own run" is ONLY true when that commit
      # matches this workflow's `paths:` filter. A merge touching just docs/ advances
      # origin/main WITHOUT creating a replacement run, so the old check would skip a
      # run that nothing else replaces. Failure mode, found live 2026-07-29:
      #   1. a site/ deploy's post-deploy gate flakes → auto-rollback reverts the site
      #   2. the operator re-runs the deploy to restore the correct tree (correct move)
      #   3. any docs-only merge landing mid-flight advances origin/main
      #   4. the re-run marks itself superseded and skips — and no replacement exists
      # Net: the site stays on the ROLLED-BACK tree indefinitely, both runs green, a
      # clean exit, nothing alarms. This was one merge from happening while #1903 (a
      # real clinician's name on a live public page) was being restored.
      #
      # So: skip only when the superseding range actually touches a trigger path. The
      # path list below must mirror `on.push.paths` above. Any git error falls through
      # to superseded=false — deploying a redundant identical tree is harmless (the
      # clobber guard is the real backstop), stranding a recovery is not.
      - name: Superseded-run check
        id: supersede
        run: |
          set -uo pipefail
          # Unshallow enough for merge-base: checkout defaults to depth 1.
          git fetch --quiet --deepen=50 origin main 2>/dev/null || git fetch --quiet origin main || true
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main 2>/dev/null || echo "$HEAD_SHA")"
          SUPERSEDED=false
          if [ "$HEAD_SHA" != "$MAIN_SHA" ] && git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
            # Does a replacement run genuinely exist? Only if the newer commits touch
            # a path this workflow triggers on.
            CHANGED="$(git diff --name-only HEAD origin/main -- \
                        'site/' 'config/' 'deploy/config_twin_sync.py' \
                        'deploy/config_twin_registry.py' \
                        '.github/workflows/site-deploy.yml' 2>/dev/null || echo '')"
            if [ -n "$CHANGED" ]; then
              SUPERSEDED=true
              echo "⏭ Superseded by ${MAIN_SHA:0:7} — it touches this workflow's trigger paths, so it has its own run deploying a superset. Skipping."
              echo "   superseding commit: $MAIN_SHA"
              echo "   trigger-path files changed between ${HEAD_SHA:0:7} and ${MAIN_SHA:0:7}:"
              echo "$CHANGED" | sed 's/^/     - /'
            else
              echo "▶ origin/main has advanced to ${MAIN_SHA:0:7}, but NO trigger-path file changed —"
              echo "  that commit has no site-deploy run of its own, so this run is NOT superseded (#1907)."
              echo "  Proceeding: skipping here would strand the site on the currently-deployed tree."
            fi
          fi
          echo "superseded=$SUPERSEDED" >> "$GITHUB_OUTPUT"

      # setup-python (v7.0.0) via the shared composite (#1655)
      - uses: ./.github/actions/setup-ci
        if: steps.supersede.outputs.superseded != 'true'

      # #3315: the canonical build (deploy_site.sh → sync_site_to_s3.sh) runs every site
      # generator, and three of them need packages this job never installed — each behind
      # a `|| echo "… skipped"` fallback. So on EVERY CI site deploy the run log read
      # `ModuleNotFoundError: No module named 'boto3'` (stack manifest, theme river) and
      # `No module named 'PIL'` (portrait PNGs) and shipped the committed artifacts
      # unchanged, green (observed run 33336278287, 2026-08-30). The eight stdlib-only
      # builders in the same script already regenerate at deploy time, so these were dark
      # by dependency accident, not by design. Installed before the build, pinned via
      # ci_pins.py (CQ-01). The config-twin step below used to install boto3 for itself —
      # same pins, moved up so the whole build shares one declared set. Guarded by
      # scripts/ci_dark_flag_sweep.py.
      - name: Install build-path dependencies (boto3, botocore, pillow)
        if: steps.supersede.outputs.superseded != 'true'
        run: |
          PINS=$(python3 scripts/ci_pins.py boto3 botocore pillow)
          pip install --quiet $PINS

      # configure-aws-credentials (v6.2.2, OIDC) via the shared composite (#1655)
      - name: Configure AWS credentials (OIDC)
        if: steps.supersede.outputs.superseded != 'true'
        uses: ./.github/actions/setup-ci
        with:
          python: 'false'
          aws-role: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy public site (canonical path)
        if: steps.supersede.outputs.superseded != 'true'
        run: |
          echo "═══ Deploying public site from merged main (${GITHUB_SHA:0:7}) ═══"
          # deploy_site.sh = validate → sync_site_to_s3.sh (clobber guard, shell
          # regeneration, PII + JS gates, content-hash, build stamp, invalidation).
          bash deploy/deploy_site.sh
          echo "✅ Public site deployed via CI"

      - name: Sync self-hosted fonts (explicit — excluded from the main sync)
        if: steps.supersede.outputs.superseded != 'true'
        run: |
          # sync_site_to_s3.sh's asset steps only ship CSS/JS under assets/ and its
          # "other files" step excludes assets/* entirely, so fonts need this
          # explicit sync (the documented manual companion step — now automated).
          # No --delete: additive only, can never remove live objects.
          aws s3 sync site/assets/fonts/ \
            "s3://matthew-life-platform/site/assets/fonts/" \
            --content-type "font/woff2" \
            --cache-control "max-age=31536000, public, immutable" \
            --region ${{ env.AWS_REGION }}
          echo "✅ Fonts synced"

      # #2019 — the THIRD deploy prefix. `site/` and `generated/` (ADR-046) each
      # have a path; bucket-root `config/` had none, so a merged registry change
      # never reached the site-api Lambda. Measured 2026-08-02: /api/supplements
      # served withdrawn citations for ~13h after the withdrawal merged, green
      # the whole time (no sync step + no-TTL container cache + 3600s CF TTL).
      #
      # This uploads EXPLICIT FILES ONLY (never `aws s3 sync`, never --delete,
      # never a prefix operation): root config/ also holds Lambda-written runtime
      # state and out-of-band objects a prefix sync would clobber or strip. The
      # twin set is derived — see deploy/config_twin_registry.py.
      - name: Sync bucket-root config/ twins (#2019)
        if: steps.supersede.outputs.superseded != 'true'
        # Armed 2026-08-02 after the owner's first reviewed sync: 7 drifted objects
        # read one by one — 6 applied repo→S3, and podcast_series_bible.json was
        # backported S3→repo first (the live object was v2, newer than the repo's v1;
        # a blind apply would have reverted an owner-approved correction).
        run: |
          # boto3/botocore come from "Install build-path dependencies" above (#3315; this
          # used to be the job's ONLY install — after the build that needed the packages).
          python3 deploy/config_twin_sync.py --apply --strict

  # ════════════════════════════════════════════════════════════════
  # Job 2a: HTTP/content smoke of the live site
  # ════════════════════════════════════════════════════════════════
  smoke:
    name: Site smoke test
    runs-on: ubuntu-latest
    needs: deploy-site
    if: needs.deploy-site.outputs.superseded != 'true'
    # #3395: the rollback's scope check reads these (the smoke twin of visual-qa's
    # #3352 outputs). The smoke script appends them to $GITHUB_OUTPUT itself, right
    # before its own exit — step outputs written before a step fails survive the
    # failure, and an ABORTED run (set -e death mid-script) writes nothing, which
    # reads as "no verdict" and rolls back exactly as before (fail-safe direction:
    # only an explicit `false` ever declines).
    outputs:
      site_reachable: ${{ steps.smoke.outputs.site_reachable }}
      surfaces: ${{ steps.smoke.outputs.surfaces }}
      summary: ${{ steps.smoke.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # #1526: the fixed `sleep 60` that used to sit here was a guess and LOST the
      # race on 2026-07-19 (05:40 UTC) — smoke read a stale edge and auto-rolled-back
      # a healthy deploy. The wait is now deterministic where the credentials live:
      # sync_site_to_s3.sh (inside the deploy-site job) blocks on
      # `aws cloudfront wait invalidation-completed`, and smoke_test_site.sh's
      # content assertions retry within a bounded propagation budget
      # (deploy/lib/cache_aware_fetch.sh) as the second net. This job stays
      # deliberately AWS-credential-free.
      # #2978 — the convergence gate's one input: WHICH build this job is judging.
      # Without it the smoke can only guess whether a red is a race or a defect,
      # which is how five per-symptom fixes accumulated while the class's rate
      # went from 1-per-2.2-days to 1-per-1.5-days. deploy_convergence.py polls
      # the viewer-path fingerprint (/version.json == this SHA) and the other
      # convergence signals before the first check runs. Credential-free by
      # construction, so this job stays exactly as credential-free as before.
      - name: Run site smoke test (pure HTTP — no AWS access)
        id: smoke
        env:
          SMOKE_EXPECT_BUILD: ${{ github.sha }}
          # #3395: the live-proof hook — `github.event.inputs.*` is EMPTY on a push,
          # so a merge can never inject; only a deliberate operator dispatch can.
          SMOKE_INJECT_SURFACE: ${{ github.event.inputs.smoke_inject_failure }}
        run: |
          bash deploy/smoke_test_site.sh

  # ════════════════════════════════════════════════════════════════
  # Job 2b: Visual + AI-vision QA (Playwright → Claude). GATING.
  # Mirrors the ci-cd.yml `visual-qa` job and visual-qa.yml — keep the
  # three step lists in sync (same pinned Playwright, same role, same
  # scripts) so a red here means the same thing as a red there.
  # #1428: --ai-qa-max-tier 1 restricts the AI-vision layer to the 6 tier-1
  # doors at deploy time (the deterministic sweep stays full surface); the
  # full AI-vision pass runs weekly on visual-qa.yml instead. #3251 (C1,
  # 2026-08-30): --reader-truth no longer runs here at all — the prose judge's
  # only CI home is the daily standalone (visual-qa.yml).
  # ════════════════════════════════════════════════════════════════
  visual-qa:
    name: Visual + AI-vision QA
    runs-on: ubuntu-latest
    needs: deploy-site
    if: needs.deploy-site.outputs.superseded != 'true'
    # #3352: the rollback's scope check reads these. Job outputs survive a FAILED job as
    # long as the step that set them RAN — which is why the classifier step below is
    # `if: always()` and never behind the sweep's success.
    outputs:
      site_reachable: ${{ steps.verdict.outputs.site_reachable }}
      surfaces: ${{ steps.verdict.outputs.surfaces }}
      summary: ${{ steps.verdict.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-python (v7.0.0, cache: pip) via the shared composite (#1655)
      - uses: ./.github/actions/setup-ci
        with:
          python-cache: 'pip'

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          # #2938: boto3 is LOAD-BEARING here, not incidental. visual_ai_qa imports
          # lambdas/ai/bedrock_client, which needs it — without it BOTH --ai-qa and
          # --reader-truth printed "⚠ unavailable" and the job still reported success,
          # so the gates CLAUDE.md/ADR-076 call gating were structurally dark. Pinned
          # via ci_pins.py from requirements-dev.txt (CQ-01, #2609), never a literal.
          # pillow (#2973): visual_ai_qa downscales full-page captures over Bedrock's
          # 8000px image limit — without it those pages FAIL loudly instead of evaluating.
          PINS=$(python3 scripts/ci_pins.py playwright boto3 botocore pillow)
          python -m pip install $PINS
          python -m playwright install --with-deps chromium

      # configure-aws-credentials (v6.2.2, OIDC) via the shared composite (#1655)
      - name: Configure AWS credentials (OIDC — for Bedrock vision QA)
        uses: ./.github/actions/setup-ci
        with:
          python: 'false'
          aws-role: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-diagnosis-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Run visual + AI-vision QA sweep
        env:
          # #3352: the live-proof hook. `github.event.inputs.*` is EMPTY on a push, so a
          # merge can never inject a failure — only an operator dispatching this workflow
          # on purpose can, and only with one of the declared choices.
          VISUAL_QA_INJECT_SURFACE: ${{ github.event.inputs.qa_inject_failure }}
          # #2978: same convergence gate as the smoke job — the sweep refuses to
          # capture a single page until the edge serves THIS build. The 2026-08-25
          # 20:43Z rollback is the counter-case that must keep failing: there every
          # signal HAD converged, so the sweep runs and reds exactly as it did live.
          VISUAL_QA_EXPECT_BUILD: ${{ github.sha }}
        run: |
          # #1428: AI-vision restricted to tier-1 (the 6 flagship doors) at deploy
          # time; the deterministic sweep runs the full surface.
          # #3251 (owner decision 2026-08-29, option C1): --reader-truth REMOVED from
          # the per-deploy copies (see ci-cd.yml's twin comment for the full basis);
          # the prose judge lives in the daily standalone (visual-qa.yml), non-gating.
          python3 tests/visual_qa.py --screenshot --ai-qa --ai-qa-max-tier 1

      - name: Accuracy gate (per-page resolves + no impossible numbers)
        id: accuracy
        run: |
          python3 tests/accuracy_audit.py --live

      # #3352 — WHICH surface failed, and can a site/** revert even reach it?
      # `if: always()` on purpose: this step is only interesting when a step above it
      # failed, and a job output can only be set by a step that RAN. Instrument, never a
      # gate — it exits 0 whatever it finds (the sweep already decided pass/fail; a second
      # failure mode here would only give the rollback a new way not to happen).
      - name: Classify the failing surface (rollback scope check)
        id: verdict
        if: always()
        run: |
          python3 tests/visual_qa_verdict.py \
            --report qa-screenshots/report.json \
            --out qa-screenshots/verdict.json \
            --accuracy-audit-result "${{ steps.accuracy.outcome }}" \
            --github-output

      - name: Upload screenshots + report
        if: always()
        # continue-on-error (#1331): this is a diagnostics side-channel, not the QA
        # verdict itself — the gate already passed/failed in the steps above. Without
        # this, account-wide GitHub Actions artifact-quota exhaustion (recalculates
        # every 6-12h, unrelated to this deploy) can fail JUST this upload post-step
        # after "GATE PASSED", flipping this job's conclusion to failure and firing
        # rollback-site-on-failure on a healthy deploy (observed 2026-07-16/17).
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-deploy-visual-qa-screenshots
          path: qa-screenshots/
          retention-days: 14

  # ════════════════════════════════════════════════════════════════
  # Job 3: Auto-rollback on a failed post-deploy gate (#418/ADR-117
  # semantics, moved here from ci-cd.yml with the site deploy itself).
  # Fires on smoke OR visual-QA failure after a successful deploy.
  # ════════════════════════════════════════════════════════════════
  rollback-site-on-failure:
    name: Auto-rollback site (smoke or visual-QA failure)
    runs-on: ubuntu-latest
    # #3352: job-level permissions REPLACE the workflow block, so the OIDC/contents
    # grants are restated. `issues: write` is for the #1447 advisory filer on the
    # decline path — a GitHub token scope, not an IAM change.
    permissions:
      id-token: write
      contents: read
      issues: write
    needs: [deploy-site, smoke, visual-qa]
    if: >-
      always() &&
      needs.deploy-site.result == 'success' &&
      needs.deploy-site.outputs.superseded != 'true' &&
      (needs.smoke.result == 'failure' || needs.visual-qa.result == 'failure')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # need HEAD~1 to restore the previous good site build

      # setup-python (v7.0.0) via the shared composite (#1655)
      - uses: ./.github/actions/setup-ci

      # #3315: rollback_site.sh re-runs the same canonical build as deploy-site, so it
      # needs the same declared set (see that job's install step for the why).
      - name: Install build-path dependencies (boto3, botocore, pillow)
        run: |
          PINS=$(python3 scripts/ci_pins.py boto3 botocore pillow)
          pip install --quiet $PINS

      # configure-aws-credentials (v6.2.2, OIDC) via the shared composite (#1655)
      - name: Configure AWS credentials (OIDC)
        uses: ./.github/actions/setup-ci
        with:
          python: 'false'
          aws-role: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # ── #3352 + #3395: the SCOPE CHECK, on BOTH gate legs ──────────────────
      #
      # Three live incidents where this job reported success and reached nothing:
      #   • 2026-08-31 P1 — the whole /data/* door was served `application/json`
      #     because of a step-ordering defect in sync_site_to_s3.sh. The rollback
      #     re-ran THAT SAME SCRIPT and re-broke the door identically.
      #   • 2026-08-27 (Session G) — it reverted a wanted, published build beat over a
      #     DynamoDB-sourced narrative defect it was structurally incapable of fixing.
      #   • 2026-09-01 P3 (#3395) — #3352 had scoped only the VISUAL leg; ONE failed
      #     SMOKE check (/api/vitals weight arbitration, DynamoDB data-plane) reverted
      #     PR #3392's innocent site content while visual QA had PASSED.
      #
      # The decision is a bash `if` INSIDE the rollback step, deliberately not a job-level
      # `if:` — a skipped job is indistinguishable from "nothing failed", and the whole
      # point is that a declined rollback must SAY SO by name.
      #
      # Fail-safe direction: only an explicit `false` declines. An empty/absent output
      # (a gate died before its verdict was written) rolls back exactly as it did before
      # this existed. Mixed verdicts follow #3352's AND rule: ONE unreachable surface
      # declines the whole rollback — a partial revert of a mixed failure is the worst
      # of both, and the #1447 issue names every surface for the human.
      - name: Roll back site to previous build + re-invalidate CDN
        id: rollback
        env:
          SITE_REACHABLE: ${{ needs.visual-qa.outputs.site_reachable }}
          QA_SURFACES: ${{ needs.visual-qa.outputs.surfaces }}
          QA_SUMMARY: ${{ needs.visual-qa.outputs.summary }}
          SMOKE_REACHABLE: ${{ needs.smoke.outputs.site_reachable }}
          SMOKE_SURFACES: ${{ needs.smoke.outputs.surfaces }}
          SMOKE_SUMMARY: ${{ needs.smoke.outputs.summary }}
        run: |
          set -uo pipefail
          echo "Rollback scope check (#3352 visual / #3395 smoke):"
          echo "  visual-qa: site_reachable='${SITE_REACHABLE:-<unset>}' surfaces='${QA_SURFACES:-<none>}'"
          echo "             ${QA_SUMMARY:-<no verdict recorded — the classifier step did not run>}"
          echo "  smoke:     site_reachable='${SMOKE_REACHABLE:-<unset>}' surfaces='${SMOKE_SURFACES:-<none>}'"
          echo "             ${SMOKE_SUMMARY:-<no verdict recorded — the smoke script did not reach its verdict>}"
          if [ "${SITE_REACHABLE:-}" = "false" ] || [ "${SMOKE_REACHABLE:-}" = "false" ]; then
            DECLINE_SURFACES=""
            DECLINE_VERDICT=""
            if [ "${SITE_REACHABLE:-}" = "false" ]; then
              DECLINE_SURFACES="visual-qa[${QA_SURFACES:-?}]"
              DECLINE_VERDICT="visual-qa: ${QA_SUMMARY:-<no summary>}"
            fi
            if [ "${SMOKE_REACHABLE:-}" = "false" ]; then
              DECLINE_SURFACES="${DECLINE_SURFACES}${DECLINE_SURFACES:+ }smoke[${SMOKE_SURFACES:-?}]"
              DECLINE_VERDICT="${DECLINE_VERDICT}${DECLINE_VERDICT:+ · }smoke: ${SMOKE_SUMMARY:-<no summary>}"
            fi
            echo "⛔ ROLLBACK DECLINED — the failing surface is NOT site/**-reachable."
            echo "   surfaces: ${DECLINE_SURFACES}"
            echo "   ${DECLINE_VERDICT}"
            echo "   Reverting site/** would either re-run the defect (deploy-script/infra) or revert"
            echo "   an innocent build while the real defect stays live (api). Alerting instead."
            echo "::warning title=Site rollback DECLINED (#3352/#3395)::${DECLINE_VERDICT}"
            {
              echo "declined=true"
              echo "surfaces=${DECLINE_SURFACES}"
              echo "verdict=${DECLINE_VERDICT}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PRIOR=$(git rev-parse --short HEAD~1)
          echo "⚠️  Post-deploy gate failed on a site/**-reachable surface — rolling back site to $PRIOR"
          # rollback_site.sh restores site/ from the ref, re-runs the canonical
          # hashing+stamp build (ALLOW_STALE_SITE override for an intentional
          # rollback), re-uploads, and invalidates CloudFront.
          bash deploy/rollback_site.sh "HEAD~1"
          {
            echo "declined=false"
            echo "prior=$PRIOR"
          } >> "$GITHUB_OUTPUT"
          echo "✅ Site rolled back to $PRIOR — verify https://averagejoematt.com/version.json"

      # The declined path is not a shrug: it files/updates ONE deduped tracked issue via
      # the #1447 helper (same action every advisory workflow uses), so an out-of-reach
      # gate failure becomes a work item instead of a line in a run log.
      - name: File the out-of-reach gate failure (#1447)
        if: always() && steps.rollback.outputs.declined == 'true'
        uses: ./.github/actions/advisory-failure-issue
        with:
          workflow-slug: site-deploy-gate-unreachable
          workflow-name: Site deploy — post-deploy gate red on a surface the rollback cannot reach
          job-status: failure
          github-token: ${{ secrets.GITHUB_TOKEN }}
          failure-summary: >-
            The site-deploy post-deploy gate failed on a surface a `site/**` revert cannot reach, so
            the auto-rollback DECLINED (#3352 visual / #3395 smoke). ${{ steps.rollback.outputs.verdict }}
            Surfaces: ${{ steps.rollback.outputs.surfaces }}.
            `deploy-script`/`infra` = the sync script's own behaviour or edge/CDK config (2026-08-31
            P1 — re-running the sync re-runs the defect; a revert cannot republish a CloudFront
            function or a CDK-owned header); `api` = DynamoDB/site-api/generated data-plane content
            (2026-08-27 Session G and 2026-09-01 P3 — reverting site/** deletes innocent work and
            leaves the defect live). Diagnose the named surface; the live site is still on the newly
            deployed build.

      - name: Notify site rollback
        if: always()
        run: |
          COMMIT="${{ github.sha }}"; SHORT="${COMMIT:0:7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GATE="smoke=${{ needs.smoke.result }} visual-qa=${{ needs.visual-qa.result }}"
          # #3352: the alert must state which of the two things happened. A declined
          # rollback that alerted as "AUTO-ROLLBACK" would be the same lie in a new place.
          if [ "${{ steps.rollback.outputs.declined }}" = "true" ]; then
            HEADLINE="ROLLBACK DECLINED (site) — the post-deploy gate failed on a surface a site/** revert cannot reach (#3352/#3395). NOTHING WAS REVERTED."
            ACTION="Rollback: DECLINED (surface=${{ steps.rollback.outputs.surfaces }} not site/**-reachable)
          Verdict:         ${{ steps.rollback.outputs.verdict }}
          A tracked issue was filed via the #1447 helper (slug site-deploy-gate-unreachable).
          The live site is STILL on $SHORT — diagnose the named surface, do not re-deploy blindly."
            SUBJECT="Life Platform SITE ROLLBACK DECLINED [$SHORT]"
          else
            HEADLINE="AUTO-ROLLBACK (site) — public site reverted after a failed post-deploy gate (site-deploy workflow)."
            ACTION="Rolled back to:  ${{ steps.rollback.outputs.prior || 'HEAD~1' }}
          Verify the site returned to the prior build: curl -s https://averagejoematt.com/version.json"
            SUBJECT="Life Platform SITE AUTO-ROLLBACK [$SHORT]"
          fi
          MESSAGE="$HEADLINE
          Deployed commit: $SHORT (${{ github.ref_name }})
          $ACTION
          Failing gate:    $GATE
          Rollback result: ${{ job.status }}
          Run: $RUN_URL"
          aws sns publish \
            --topic-arn "${{ env.SNS_TOPIC_ARN }}" \
            --subject "$SUBJECT" \
            --message "$MESSAGE" \
            --region ${{ env.AWS_REGION }} || echo "::warning::SNS publish failed — site rollback still completed"
          echo "✅ Site rollback notification sent"

  # ════════════════════════════════════════════════════════════════
  # Job 3b: Close the out-of-reach-gate issue once the gates are green again
  # (#3352). Without this the #1447 body's "auto-closes on the next green run
  # of this workflow" close policy would be a claim nothing implements — the
  # decline path only ever runs on failure. Recover mode is a no-op when no
  # such issue is open, so on a normal green deploy this job costs one runner
  # minute and prints "nothing to resolve".
  # ════════════════════════════════════════════════════════════════
  resolve-gate-unreachable-issue:
    name: Resolve out-of-reach gate issue (if any)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    needs: [deploy-site, smoke, visual-qa]
    if: >-
      always() &&
      needs.deploy-site.result == 'success' &&
      needs.deploy-site.outputs.superseded != 'true' &&
      needs.smoke.result == 'success' &&
      needs.visual-qa.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/advisory-failure-issue
        with:
          workflow-slug: site-deploy-gate-unreachable
          workflow-name: Site deploy — post-deploy gate red on a surface the rollback cannot reach
          job-status: success
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════════
  # Job 4: Notify when the DEPLOY itself fails (nothing shipped, or a
  # partial sync). Gate failures are covered by the rollback job's alert.
  # ════════════════════════════════════════════════════════════════
  notify-deploy-failure:
    name: Notify deploy failure
    runs-on: ubuntu-latest
    needs: deploy-site
    if: always() && needs.deploy-site.result == 'failure'
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Post failure to SNS
        run: |
          COMMIT="${{ github.sha }}"; SHORT="${COMMIT:0:7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="SITE DEPLOY FAILED (site-deploy workflow) — the CI site sync did not complete.
          Commit: $SHORT (${{ github.ref_name }})
          Run: $RUN_URL

          If the sync died mid-flight the live site may be a mixed build — check
          https://averagejoematt.com/version.json, then either re-run this workflow
          (re-deploys merged main) or roll back: bash deploy/rollback_site.sh HEAD~1"
          aws sns publish \
            --topic-arn "${{ env.SNS_TOPIC_ARN }}" \
            --subject "Life Platform SITE DEPLOY FAILED [$SHORT]" \
            --message "$MESSAGE" \
            --region ${{ env.AWS_REGION }} || echo "::warning::SNS publish failed — the run failure is still visible in Actions"
