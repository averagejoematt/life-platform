# The panel rubric's regression gate (#5072, epic #5067) — OWNER-APPROVED WORKFLOW CHANGE.
# A charter, engine-template, skill, coach-prompt or food-resolver change can make the plan worse with every
# unit test green. `scripts/panel_rubric_gate.py` grades the golden training AND food cases (#5110) in
# tests/fixtures/panel_golden_5072/ against config/panel_rubric.json: red when a good plan drops below
# panel_target or a negative control passes what it must fail. The script's docstring is the full contract:
#   * --recorded (gating, free, no AWS): the code pre-score + the replayed judge (also in the unit suite).
#   * --live (gating): the blinded judge on charter.judge_gate (band 3), ~$0.30 a run. Soft ONLY on a budget
#     pause (SKIPPED-BY-BUDGET + ::warning::); a judge error or ungradeable reply is FAIL + ::error::, exit 1.
# Degrade points (read-only `aws iam get-role`/`get-role-policy`, 2026-10-19): the golden-eval role's trust admits
# refs/heads/main only, so a pull_request is refused at the OIDC step ("live judge NOT run" + ::warning::); it
# grants Haiku only, so a dispatch on main is denied at the judge call and the live step is RED until the
# owner's Sonnet 4.6 grant (PR #5169). Path filter = the #5072 `## Set` + the gate's inputs + the food resolvers.

name: Panel rubric gate

on:
  pull_request:
    paths:
      - 'config/training_*.json'
      - 'config/panel_rubric.json'
      - 'config/coaches/physical_coach*.json'
      - 'lambdas/training/program_structure.py'
      - 'lambdas/training/routine_generator.py'
      - 'lambdas/training/panel_rubric.py'
      - 'lambdas/training/panel_judge.py'
      - 'lambdas/training/food_panel.py'
      - 'lambdas/health/calorie_target.py'
      - 'lambdas/health/protein_engine.py'
      - 'lambdas/health/macro_floors.py'
      - 'lambdas/health/titration.py'
      - 'lambdas/coach/critics*.py'
      - '.claude/skills/daily-debrief/SKILL.md'
      - 'docs/coaching/COACH_SESSION.md'
      - 'scripts/panel_rubric_gate.py'
      - 'tests/fixtures/panel_golden_5072/**'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # OIDC for the live judge only

concurrency:
  group: panel-rubric-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: "205930651321"

jobs:
  gate:
    name: Panel rubric gate (golden plan cases)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-ci

      - name: Install dependencies (boto3, botocore)
        run: |
          PINS=$(python3 scripts/ci_pins.py boto3 botocore)
          pip install --quiet $PINS

      - name: Recorded judge (gating, free)
        # Unpiped: the script's own exit code is the verdict (the #3103 class).
        run: python3 scripts/panel_rubric_gate.py --recorded

      - name: Configure AWS (live judge)
        id: judge-creds
        continue-on-error: true # refused on pull_request (trust = main only); the live step reports it
        uses: ./.github/actions/setup-ci
        with:
          python: 'false'
          aws-role: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-golden-eval-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Live judge (red when the judge errors; soft only on a budget pause)
        env:
          PANEL_JUDGE_CREDS: ${{ steps.judge-creds.outcome }}
        run: python3 scripts/panel_rubric_gate.py --live
