name: Fresh-Eyes Discovery

# Weekly unattended fresh-eyes discovery (#823). Pre-computes the /uplevel
# Phase-1 "fresh-eyes lens" board so a session starts from a ranked board
# instead of spending its first ~30 min re-surveying the live site. Read-only:
# screenshots the live site, reads it via Bedrock vision, dedups against the
# open GitHub backlog, and emails a ranked <=5-item board. See
# scripts/fresh_eyes_discovery.py for the pipeline and
# tests/test_fresh_eyes_discovery.py for the offline-tested pure parts.
#
# Reuses the existing github-actions-remediation-role (Bedrock + SSM read + SES
# already granted there, deploy/setup_remediation_role.sh) — this workflow
# requests NO new IAM. Gated by SSM /life-platform/budget-tier (skips at >= 2).

on:
  schedule:
    # Weekly, Sunday ~08:00 PT (15:00 UTC) — ahead of a Monday /uplevel session.
    - cron: "0 15 * * 0"
  workflow_dispatch: {} # manual test

permissions:
  contents: read
  id-token: write # AWS OIDC
  issues: write # advisory-failure issue filing (#1447)

concurrency:
  group: fresh-eyes-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Weekly fresh-eyes survey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-python (v7.0.0, cache: pip) via the shared composite (#1655)
      - uses: ./.github/actions/setup-ci
        with:
          python-cache: "pip"

      - name: Install Playwright + Chromium + boto3 + pillow
        run: |
          python -m pip install --upgrade pip
          # #3315: pillow is LOAD-BEARING since #3079 routed this script's captures through
          # visual_ai_qa._image_blocks — every full-page door is taller than the judge-
          # legibility bound, so without Pillow each one raises "Pillow is not installed to
          # tile it" and the run exits non-zero. Never exercised in CI: every fire since
          # #3079 landed (2026-08-27) skipped at budget tier 2. botocore joins boto3 so this
          # copy resolves the same explicit pins as the three visual-qa copies (CQ-01).
          PINS=$(python3 scripts/ci_pins.py playwright boto3 botocore pillow)   # versions from requirements-dev.txt (CQ-01, #2058/#2609)
          python -m pip install $PINS
          python -m playwright install --with-deps chromium

      # configure-aws-credentials (v6.2.2, OIDC) via the shared composite (#1655)
      - name: Configure AWS credentials (OIDC → remediation role)
        uses: ./.github/actions/setup-ci
        with:
          python: 'false'
          aws-role: arn:aws:iam::205930651321:role/github-actions-remediation-role
          aws-region: us-west-2

      - name: Run weekly fresh-eyes discovery
        env:
          AWS_REGION: us-west-2
          S3_BUCKET: matthew-life-platform
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/fresh_eyes_discovery.py

      - name: Upload screenshots (diagnostic)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresh-eyes-screenshots
          path: qa-screenshots-fresh-eyes/
          retention-days: 14
          if-no-files-found: ignore

      # #1447 — advisory: a red here only cost the week's pre-computed
      # fresh-eyes board, so nothing surfaced it. File/update ONE deduped
      # auto-filed issue on failure; auto-close on the next green run.
      - name: File/resolve advisory failure issue (#1447)
        if: always()
        uses: ./.github/actions/advisory-failure-issue
        with:
          workflow-slug: fresh-eyes-discovery
          workflow-name: Fresh-Eyes Discovery
          job-status: ${{ job.status }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          failure-summary: >-
            The weekly unattended fresh-eyes discovery (scripts/fresh_eyes_discovery.py:
            live-site screenshots -> Bedrock vision read -> backlog dedup -> ranked
            board email) failed, so the coming week's /uplevel Phase-1 board was NOT
            pre-computed or emailed. Diagnostic screenshots, if captured, are on the
            run as the fresh-eyes-screenshots artifact.
