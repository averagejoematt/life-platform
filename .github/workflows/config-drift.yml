# Bucket-root config/ drift check (#2019) — make "merged but not serving" alarm.
#
# The 2026-08-02 incident had no detector at all: a merged citation withdrawal
# never reached s3://matthew-life-platform/config/, and /api/supplements kept
# serving the withdrawn citations for ~13h while every gate printed green. The
# merge-time sync now lives in site-deploy.yml; this workflow is the standing
# net for everything that sync cannot see — an out-of-band `aws s3 cp`, a
# superseded/skipped site-deploy run, a reset that purged an object, or a sync
# step that silently failed.
#
# Read-only: the check only does GetObject and compares sha256 against the repo
# twin. It never writes S3, never invalidates, never touches a Lambda. A red run
# is the alarm — fix it with `python3 deploy/config_twin_sync.py --apply` from
# main (or let the next site-deploy do it).
#
# Deliberately NOT a job inside site-deploy.yml: this must run when nothing was
# merged, which is exactly when the drift class goes unnoticed.

name: Config twin drift

on:
  schedule:
    - cron: '20 15 * * *'   # 08:20 PT — after the 17:00 UTC brief reads config
  workflow_dispatch: {}
#
# No `pull_request` trigger on purpose. A PR's repo bytes are SUPPOSED to differ
# from live S3 — the change hasn't deployed yet — so a strict check there would
# red every config PR for the one reason that isn't a fault. Drift is only
# meaningful against merged main, which is what the schedule reads.

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: "205930651321"

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

concurrency:
  group: config-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Repo config/ vs live S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-python + configure-aws-credentials via the shared composite (#1655)
      - uses: ./.github/actions/setup-ci
        with:
          aws-role: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      # The derivation is the load-bearing part — if it silently returned an
      # empty set the check would pass vacuously, which is the failure mode this
      # whole issue is about. Assert it found twins before trusting a green.
      - name: Report the derived twin set
        run: |
          # #3785: `config_twin_registry` now imports the ownership registry, whose own
          # import chain reaches `config_provenance_audit`'s lazy boto3 import. Nothing on
          # THIS step's path calls it — `derive()` is pure AST + git — but a reachable
          # import that the job never installs is exactly what #3315's dark-flag sweep
          # exists to stop being discovered at runtime, so the pins land here too.
          PINS=$(python3 scripts/ci_pins.py boto3 botocore)
          pip install --quiet $PINS
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "deploy")
          from config_twin_registry import derive
          reg = derive(".")
          consumed = [t for t in reg.twins if t.consumed]
          print(f"derived twins: {len(reg.twins)} ({len(consumed)} read by a deployed module)")
          for t in consumed:
              print(f"  {t.key}")
          print(f"alias patterns (#2057, expanded against live S3 at check time): {reg.alias_patterns}")
          if not reg.alias_patterns:
              print("::warning::no alias patterns derived — user-scoped config mirrors would go unchecked")
          print(f"runtime-written, excluded: {sorted(reg.runtime_written)}")
          print(f"bundled into the zip, excluded: {reg.bundled_into_lambda}")
          if reg.unresolved_writers:
              print(f"::warning::unresolvable config/ write sites: {reg.unresolved_writers}")
          if not consumed:
              print("::error::derivation returned NO consumed twins — the check would pass vacuously")
              sys.exit(1)
          PY

      - name: Drift check (read-only, blocking)
        run: |
          # setup-ci installs no packages; without this the check dies on import, not
          # on drift. Versions from requirements-dev.txt via ci_pins.py (#2760).
          PINS=$(python3 scripts/ci_pins.py boto3 botocore)
          pip install --quiet $PINS
          python3 deploy/config_twin_sync.py --strict

      # #2057 — the inverse question. The drift check above walks REPO files and
      # asks whether S3 matches; it is blind to any object the repo does not
      # author, which is how a runtime-written or out-of-band mirror can serve
      # stale forever while this workflow prints green. This step walks LIVE S3
      # instead and asks what asserts each object a Lambda actually reads.
      #
      # Runs even when the drift check failed: the two answer different
      # questions, and masking one behind the other is how #2019's residue
      # stayed invisible in the first place.
      - name: Mirror ownership + freshness audit (read-only, blocking)
        if: always()
        run: |
          PINS=$(python3 scripts/ci_pins.py boto3 botocore)   # versions from requirements-dev.txt (#2760)
          pip install --quiet $PINS
          python3 deploy/config_mirror_audit.py --strict

      # #3785 box 3 — the third question, and the one the other two structurally cannot
      # answer. Both steps above COMPARE two artifacts: repo vs live, or live vs an owner
      # that asserts it. On 2026-09-14 a repo copy was pushed over the generated
      # hevy_template_index and the drift check was green for NINE runs, because while
      # the clobber was active both sides read 789 and agreed. A comparison gate is blind
      # in exactly the state that matters.
      #
      # This step grades ONE artifact against the CLOCK. Only the generated object carries
      # `_built_at`; the moment a hand-owned copy lands on top of it, the stamp is gone and
      # this reds — no peer needed, and no way for the two to be wrong together.
      #
      # Also `if: always()`, for the reason stated above the previous step: three different
      # questions, and masking any behind another is how #2019's residue stayed invisible.
      - name: Generated-artifact provenance dead-man (read-only, blocking)
        if: always()
        run: |
          PINS=$(python3 scripts/ci_pins.py boto3 botocore)
          pip install --quiet $PINS
          python3 deploy/config_provenance_audit.py --strict

      # #3785 boxes 1+2 — the REPO-side half, and the only step here needing no AWS at
      # all. The three steps above grade the LIVE objects; none of them can see the thing
      # that actually fired the incident, which was a stale GENERATED artifact sitting in
      # the repo as loadable ammunition for the deploy path (site-deploy's twin sync
      # pushed it three times — see deploy/config_ownership_audit.py's docstring for the
      # run ids). This asks: is every `config/**.json` ruled generated-vs-hand-owned, does
      # every generated ruling still name a producer that ASSIGNS its key, and has any
      # generated artifact acquired a committed twin again?
      #
      # `if: always()` for the same reason as the two steps above. Duplicated in the
      # pytest lane by tests/test_config_ownership_3785.py on purpose: the PR lane is
      # where a re-committed twin should be stopped, and this schedule is where one that
      # arrived by some other path is found.
      - name: config/ ownership registry (repo-side, no AWS, blocking)
        if: always()
        run: python3 deploy/config_ownership_audit.py --strict
