# Reusable: Unit Tests — the exhaustive offline suite (#1655)
# Extracted verbatim from ci-cd.yml's `test` job. NON-GATING for deploy (#416/ADR-117):
# the orchestrator wires nothing except notify-failure to this call, so a red here still
# flags main but no longer skips plan → deploy → visual-QA. Offline (no AWS), so
# `contents: read` suffices. build_sha (the #1173 reconciled tree) is passed in.
name: CI · Unit Tests

on:
  workflow_call:
    inputs:
      build_sha:
        description: 'The reconciled tree SHA to check out (#1173).'
        required: true
        type: string
      owner_run:
        description: >-
          #4252: the id of another CI/CD push run whose OWN head is build_sha and which
          therefore owns this sha's unit-test verdict (scripts/find_test_verdict_owner.py).
          Empty (the default) = this run tests.
        required: false
        type: string
        default: ''

# Reusable workflows do NOT inherit the caller's permissions — declare our own.
permissions:
  contents: read

jobs:
  # #4252 box 4: the suite runs as THREE matrix legs on three runners, then `test` below
  # combines their coverage data and grades the floor once, over the union.
  #
  # Before this split the whole suite ran on ONE 4-core runner — the parallel pass
  # (~985s) then the serial pass (~290s) — and that job alone was 18.5-23.6 min of every
  # push to main, against the box-4 bar of 20 min wall-clock. Measured on the last green
  # runs before the split (38026562985, 38022061772): coverage step 1284s / 1263s of a
  # 21.8 / 21.5 min job. The legs:
  #   parallel-1, parallel-2  the `-m "not serial"` pass, each collecting only ITS half
  #                           of the test FILES (CI_TEST_SHARD=K/N, tests/ci_shard.py —
  #                           a stable crc32 split by file name, exact by construction);
  #   serial                  the `-m serial` pass, unchanged, on its own runner, so the
  #                           in-tree writers still never share a checkout with xdist.
  # tests/test_ci_test_shards_4252.py holds the matrix, the shard count and the
  # combine step to each other.
  shard:
    name: Unit Tests shard (${{ matrix.leg }})
    # #4252: skipped ONLY when another push run owns this exact sha's verdict.
    if: inputs.owner_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Every leg runs to its own verdict: one red leg must not cancel the others and
      # hide THEIR failures until the next push.
      fail-fast: false
      matrix:
        include:
          - leg: parallel-1
            shard: '1/2'
          - leg: parallel-2
            shard: '2/2'
          - leg: serial
            shard: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build_sha }}   # #1173: the reconciled tree

      # #1349: stamp the leg's own start epoch. `test` reads the EARLIEST leg's stamp,
      # so the duration budget measures the test phase's wall-clock, not one runner's.
      - name: Record job start time (#1349 duration budget)
        run: |
          mkdir -p shard-out
          date +%s > "shard-out/start-${{ matrix.leg }}.epoch"

      # setup-python (v7.0.0, cache: pip) via the shared composite (#1655)
      - uses: ./.github/actions/setup-ci
        with:
          python-cache: 'pip'  # V2 P4.14: speeds up CI by ~20s per job

      - name: Install test dependencies
        # Phase 8.2: pytest-cov for coverage report; hypothesis: property tests (#1664).
        # Versions are READ from requirements-dev.txt, never copied here (CQ-01, #2609) —
        # a second copy is what made every Dependabot bump born red.
        run: |
          # pillow (#2973): lets test_visual_ai_qa's real-downscale test run here
          # (visual_ai_qa._prepare_image; pytest.importorskip elsewhere).
          PINS=$(python3 scripts/ci_pins.py pytest pytest-cov pytest-xdist boto3 botocore hypothesis pyyaml pillow)
          pip install $PINS

      - name: Coverage pass — this leg's share of tests/
        # #4252: COVERAGE_CORE=sysmon — coverage.py's sys.monitoring tracer (PEP 669; the
        # Python this job pins supports it). Line coverage only, which is all this repo
        # measures (no `branch = true`). Measured on a quarter of tests/ (336 files, 7,322
        # tests, the same interpreter and pins, four xdist workers): no coverage 175s,
        # default ctrace tracer 273s, sysmon 200s — and the per-file report was
        # byte-identical between the two tracers (577 rows, same TOTAL), so the floor and
        # the high-water ratchet read the same number, faster.
        env:
          COVERAGE_CORE: sysmon
          CI_TEST_SHARD: ${{ matrix.shard }}   # '' on the serial leg = not sharded
          LEG: ${{ matrix.leg }}
        run: |
          # `set -o pipefail` is LOAD-BEARING (#2259). GitHub's default shell is
          # `bash -e {0}`; `-e` does not imply pipefail, so `pytest … | tail -100`
          # exited with tail's status (always 0). Both the coverage floor AND every
          # test failure in this step were therefore silently discarded — this gate has
          # never once failed a build. Proven locally:
          #   bash -e -c 'python3 -c "import sys; sys.exit(1)" | tail -100'; echo $?  → 0
          # Do not remove this line, and do not add another unguarded pipe below it.
          set -o pipefail
          # #2692: --durations=25 so the NEXT run can answer "which tests" rather than
          # only "how long". The wall-clock budget has now been breached four times and
          # every diagnosis so far has been local, where the suite behaves differently
          # from this runner — the local/CI gap is half of what the issue asks to
          # explain, and it cannot be closed from a laptop. This is display-only: no
          # selection, no threshold, no gate behaviour changes.
          #
          # tail widened 100 -> 160 with it. The durations block prints in pytest's
          # terminal summary alongside the (long) coverage table, so at -100 the very
          # lines this flag exists to produce were the ones most likely to be cut —
          # a measurement that silently truncates reports nothing, which is the
          # failure mode this repo keeps re-learning.
          # #3835: TWO passes, the same lane #3797 already proved on pr-checks.yml.
          # This job was a single serial invocation and ran over its 1950s budget on
          # 8 of 9 consecutive green-main runs (median 2850s = 1.46x).
          #
          # The partition is safe only because the two -m expressions are exact
          # complements over one registered marker; tests/test_full_suite_premerge_3025.py
          # asserts that for BOTH lanes, so a test cannot fall into neither pass while
          # both steps stay green.
          #
          # #4252: the two passes now run on separate legs. A parallel leg runs the
          # `-m "not serial"` pass over its half of the FILES; the serial leg runs the
          # `-m serial` pass over the whole tree. NO leg grades the floor or writes a
          # report — grading one leg would grade a subset and red a correct build. Each
          # leaves its raw data file for `test`, which combines every leg's first.
          # `--cov-fail-under=0` is what says so: pytest-cov otherwise reads pyproject's
          # `fail_under` and grades THIS leg's subset against it (a serial leg of ~110
          # tests fails it by construction, and a half leg can).
          if [ "$LEG" = "serial" ]; then
            echo "::group::Coverage — serial pass (-m serial)"
            python3 -m pytest tests/ \
                --ignore=tests/test_integration_aws.py \
                --cov=lambdas --cov=mcp \
                --cov-report= --cov-fail-under=0 \
                --durations=25 \
                -m serial \
                --junitxml=shard-out/junit-serial.xml \
                -q 2>&1 | tail -160
          else
            echo "::group::Coverage — parallel pass (-m 'not serial'), files of shard $CI_TEST_SHARD"
            python3 -m pytest tests/ \
                --ignore=tests/test_integration_aws.py \
                --cov=lambdas --cov=mcp \
                --cov-report= --cov-fail-under=0 \
                --durations=25 \
                -n auto --dist loadfile -m "not serial" \
                --junitxml="shard-out/junit-$LEG.xml" \
                -q 2>&1 | tail -60
          fi
          echo "::endgroup::"
          mv .coverage "shard-out/coverage-$LEG.dat"

      - name: Upload this leg's coverage data + JUnit
        # always(): a red leg's JUnit is what names its failures in `test`'s sections.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-tests-shard-${{ matrix.leg }}
          path: shard-out/
          retention-days: 3
          overwrite: true
          if-no-files-found: warn

  test:
    name: Unit Tests
    # #4252: the VERDICT job — `test / Unit Tests` is the name scripts/find_test_verdict_owner.py
    # and check_main_green.py read. It needs every leg, and runs even when a leg is red
    # (`!cancelled()`) so the red is reported HERE, with the sections, instead of this
    # job going `skipped`. Skipped, exactly as before, when another push run owns the sha.
    needs: shard
    if: ${{ !cancelled() && inputs.owner_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build_sha }}   # #1173: the reconciled tree (coverage reports read its sources)

      # setup-python (v7.0.0, cache: pip) via the shared composite (#1655)
      - uses: ./.github/actions/setup-ci
        with:
          python-cache: 'pip'  # V2 P4.14: speeds up CI by ~20s per job

      - name: Install test dependencies
        # Phase 8.2: pytest-cov for coverage report; hypothesis: property tests (#1664).
        # Versions are READ from requirements-dev.txt, never copied here (CQ-01, #2609) —
        # a second copy is what made every Dependabot bump born red.
        run: |
          # pillow (#2973): lets test_visual_ai_qa's real-downscale test run here
          # (visual_ai_qa._prepare_image; pytest.importorskip elsewhere).
          PINS=$(python3 scripts/ci_pins.py pytest pytest-cov pytest-xdist boto3 botocore hypothesis pyyaml pillow)
          pip install $PINS

      - name: Name every playwright-gated test skip (#3640)
        # No leg installs playwright/chromium, so every module in this set
        # SKIPS silently in the shard legs (invisible in the tail-truncated pytest summary)
        # while it can FAIL on any machine that does have chromium. Name each one
        # loudly here so a lane's first red on such a machine is never mistaken
        # for something this job would have caught.
        run: python3 scripts/playwright_gated_tests.py

      # #4252: ELEVEN single-file pytest steps used to sit around the secrets scan below
      # ("Run unit tests" = test_shared_modules.py, then ten "... linter" / contract steps).
      # Each file then ran AGAIN in the coverage passes, which select the whole tests/
      # tree. They are gone; their labels survive as named sections that
      # scripts/ci_test_sections.py prints from the coverage passes' JUnit XML (in the
      # drift-warnings step below, which runs `if: always()`). A red file is annotated
      # with its old step name. tests/test_full_suite_premerge_3025.py holds the label
      # list against the files and keeps any single-file pytest step from coming back.
      - name: Deprecated secrets scan
        run: |
          echo "::group::Deprecated secrets scan"
          FAILED=0

          while IFS= read -r line; do
            secret=$(echo "$line" | sed 's/#.*//' | xargs)
            [ -z "$secret" ] && continue

            echo "Scanning for deprecated secret: $secret"
            MATCHES=$(grep -rn --include='*.py' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.sh' "$secret" \
              lambdas/ mcp/ cdk/ .github/ ci/ \
              --exclude-dir='.venv' --exclude-dir='cdk.out' \
              2>/dev/null | grep -v 'deprecated_secrets.txt' | grep -v '^Binary' || true)

            if [ -n "$MATCHES" ]; then
              echo "::error::Deprecated secret '$secret' still referenced:"
              echo "$MATCHES" | head -20
              FAILED=$((FAILED + 1))
            else
              echo "  ✅ No references to '$secret'"
            fi
          done < ci/deprecated_secrets.txt

          echo "::endgroup::"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED deprecated secret(s) still referenced. Update to current secret names before merging."
            exit 1
          fi
          echo "✅ Deprecated secrets scan passed"

      # #2259: the standalone "Full test suite" step that used to sit here ran the
      # EXACT same selection as the coverage gate below (`tests/` minus
      # test_integration_aws.py) — the whole suite, twice, 493s + 705s = 1228s against
      # a 1200s budget. It was deleted rather than parallelised: no new dependency, no
      # xdist, ~42% off this job's wall-clock.
      #
      # The pre-merge half of this pair lives in pr-checks.yml, which selects the
      # `premerge` marker (tests/conftest.py auto-applies it to the behaviour suite +
      # everything deploy_critical). Both lanes name that ONE marker on purpose:
      # tests/test_premerge_lane.py fails if either stops referencing it, which is what
      # stops the two lanes silently diverging the way they did before #2258.
      #
      # It was only safe to delete once the `pipefail` bug below was fixed. Until then
      # the coverage step's `| tail -100` swallowed pytest's exit code (GitHub's default
      # shell is `bash -e {0}` — `-e` does NOT imply pipefail), so the deleted step was
      # the ONLY one on main whose test failures could actually red the build. Removing
      # it without the fix would have left main with no test signal at all while
      # continuing to report green.

      - name: Download every leg's coverage data + JUnit (#4252)
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-tests-shard-*
          path: shard-out
          merge-multiple: true

      - name: Test coverage gate (regression floor, ADR-080)
        # ENFORCED regression floor (ADR-080/ADR-107). The codebase is integration-tested
        # (handlers run live; most offline tests are structural/contract), so measured
        # offline line coverage sits comfortably above this floor. The floor exists to
        # stop BACKSLIDING; it is not a quality bar, and it is not the tightest gate —
        # the measured-coverage high-water ratchet in the gap-warning step below is.
        #
        # NO MEASUREMENT IS WRITTEN HERE (#3539). This comment used to carry three
        # different eras of hand-typed percentages at once — a "measured" figure, a
        # "banked at" figure and a "catch line" arithmetic — while green main measured
        # something different from all three. Each was a phrase-keyed copy of a fact owned
        # elsewhere, and nothing compared any of them to anything. The numbers and the
        # full ratchet lineage now live in ONE owner, tests/test_coverage_floor_ratchet.py
        # (RATCHET_FLOOR / RATCHET_HIGH_WATER / HIGH_WATER_TOLERANCE + LINEAGE), and
        # test_ci_comment_carries_no_uncommitted_percentage asserts that every percentage
        # literal in this step's comments is one of those committed constants. To move a
        # number, move the constant.
        #
        # The floor is CANONICAL in pyproject.toml `[tool.coverage.report] fail_under`;
        # the explicit `--fail-under` below is belt-and-suspenders and MUST match it —
        # tests/test_coverage_floor_ratchet.py fails if the two (and the gap-warn --floor
        # below) ever drift or drop below the committed RATCHET_FLOOR (up-only). Keep
        # ratcheting up. Scope: lambdas/ + mcp/ only.
        #
        # #4252: the passes now run in the `shard` legs above; this step COMBINES their
        # data and grades the floor once over the union. It first refuses a red leg and
        # a missing leg's data — grading the floor over a subset of the suite is the
        # exact hazard the old two-pass layout guarded against with --cov-append.
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
          EXPECTED_LEGS: 3   # = the shard matrix's legs; tests/test_ci_test_shards_4252.py holds them equal
        run: |
          set -o pipefail
          echo "::group::Coverage report + gate (combined over every shard leg)"
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error title=Unit Tests (#4252)::a shard leg did not pass (needs.shard.result=$SHARD_RESULT) — its own job log names the failing tests"
            exit 1
          fi
          shopt -s nullglob
          DATA=(shard-out/coverage-*.dat)
          if [ "${#DATA[@]}" != "$EXPECTED_LEGS" ]; then
            echo "::error title=Unit Tests (#4252)::${#DATA[@]} coverage data file(s) for $EXPECTED_LEGS legs — the floor would grade a subset of the suite"
            exit 1
          fi
          python3 -m coverage combine --keep "${DATA[@]}"
          python3 -m coverage xml -o coverage.xml
          python3 -m coverage report --fail-under=82 --skip-covered --show-missing 2>&1 | tail -160
          echo "::endgroup::"

      - name: Coverage regression gate + drift warnings (ratchet, #1206/#1349/#1658)
        # THREE checks in one script. (1) and (2) are advisory/fail-open and never
        # fail the build; (3) is ENFORCING (`--fail-on-regression`) but still
        # fail-open on a missing/unparseable coverage.xml, so keep `if: always()`:
        #  (1) #1206: parses coverage.xml's line-rate and emits a GitHub
        #      ::warning:: when the enforced floor lags measured line coverage
        #      by >10 points, so the ratchet reminds a human to bump it.
        #  (2) #1349/#1966/#2152: computes this job's own wall-clock from the
        #      start-epoch stamped above and warns when it exceeds the budget
        #      below — same self-reminding-ratchet shape, applied to suite cost.
        #      BUDGET DERIVATION (#2152, 2026-08-06 — measure-first, not
        #      plucked): #1966 raised 480->900s from a 6-run sample hours before
        #      the same session merged ~200 more tests, breaching the new budget
        #      (985s) within the day — proof a budget derived from one point-in-
        #      time sample goes stale fast under this suite's growth rate. This
        #      re-derivation samples EVERY green-main "Unit Tests" job run in the
        #      post-#2132 era (8 runs, 2026-08-05/06, via the GitHub API):
        #      704s/945s/745s/745s/922s/764s/985s/833s (avg ~830s, max 985s) —
        #      the max alone already exceeds the 900s budget it's replacing.
        #      1200s (20min) = ~22% headroom above the observed max / ~45% above
        #      the average — enough to absorb several more weeks of the same
        #      honest growth curve without flapping on every green run, while
        #      still catching a genuine future regression (e.g. an unmocked
        #      wait a new test accidentally introduces). The #1966
        #      standing-warning triage gate (`scripts/check_ci_warnings.py`,
        #      /wrap step (e11)) still obligates a same-session decision the
        #      next time this fires. #3025 (2026-08-23) re-derived again from
        #      CI's own --durations measurement, moving 1200 -> 1500.
        #      #3106 (2026-08-24, ADR-105 measure-first): the 1500s budget bred
        #      the exact same class a third time — the D2 session's ~230 new
        #      tests breached it on green main (1507s, 7s over) within the
        #      day. Sampled ALL 10 green-main "test / Unit Tests" runs since
        #      #3025 landed 1500s (GitHub API, runs 32637512129..32762278235,
        #      2026-08-23 11:50 -> 2026-08-24 18:29): 1175/1022/1179/1204/
        #      1358/1580/1255/1305/1467/1507s (avg ~1305s, max 1580s) — TWO of
        #      those 10 already breached 1500s outright, a 20% breach rate on
        #      a budget that had JUST been raised. `--durations=25` on the
        #      current run (21,146 tests) shows no single test over 51s and no
        #      dominating outlier: the top 5 are all
        #      tests/test_platform_model_drift.py (50.07/27.31/27.24/25.03/
        #      24.89s ≈ 154s total) — the same known generation/drift family
        #      #3025 already priced, asserting real generated artifacts, not a
        #      slow-test mistake to trim. Honest broad growth again: applying
        #      the same ~23% above-observed-max headroom #1966/#2152/#3025
        #      each used (1580 * 1.23 ≈ 1943s), the budget moved 1500 -> 1950
        #      (~49% above the 10-run average, ~23% above the observed max).
        #      #3224 (2026-08-27) IS THE FIRST INSTANCE OF THIS CLASS NOT
        #      ANSWERED BY A RAISE, and the number below is deliberately
        #      UNCHANGED at 1950 despite a 1994s breach on green main
        #      (678a0598, run 33030125667). Reading the two runs' own
        #      --durations blocks against each other showed the growth is NOT
        #      mostly new tests: +1,120 tests (+5.3%) but +482s (+32.9%), i.e.
        #      mean cost per test rose 26.2%. The dominant term is duplicated
        #      whole-repo scans — `check_doc_facts.py` went 7.29s -> 15.41s
        #      between the two shas (reproduced locally at both), 8.09s of the
        #      new cost being the gate census #3126/#3156 put on the
        #      auto-discovery path, and THREE tests ran that identical scan.
        #      The breach was paid for by sharing those spawns
        #      (tests/repo_scan_cache.py) instead of by moving this literal.
        #      Read tests/test_duration_budget_ratchet.py's docstring — it now
        #      holds the whole class record plus a HARD_CEILING_SECONDS the
        #      budget may not be raised past — BEFORE editing this number.
        #      #3265 (2026-08-30) IS THE SECOND NON-RAISE. 2244s measured on
        #      green main (3eff37e6f, run 33102082658) was attributed, not
        #      re-derived: sampling all 44 "test / Unit Tests" runs since
        #      #3224 landed showed an 88.5% wall-clock spread against 3.3%
        #      test-count growth (r=0.257 — mostly CI-queueing noise, per
        #      #3224's own "raw CI wall clock is noisy" warning), and the
        #      instance itself decomposed to 9.4% new-test time / 89.5%
        #      existing-test slowdown — the SAME shape as #3224. The dominant
        #      terms were two duplicated in-process whole-repo scans (not new
        #      check_doc_facts.py spawns — that shed held):
        #      tests/test_fixture_frame_pairing_3222.py re-scanned the same
        #      ~1,036-file tree its own cached `_measure()` had already walked;
        #      tests/test_platform_model_drift.py's `_built()` rebuilt the
        #      system model on every one of 6 calls with zero memoization,
        #      despite its own test proving the build is deterministic. Both
        #      fixed with a cache, not a raise. Full attribution + both
        #      measured before/after deltas: tests/test_duration_budget_
        #      ratchet.py's docstring and its BUDGET_SECONDS comment block.
        #  (3) #1658: the MEASURED-coverage high-water ratchet — the only check
        #      here that can red the build. `--cov-fail-under` above is set a few
        #      points BELOW measured on purpose (anti-flap headroom), and until
        #      now that headroom was unguarded: real coverage could be deleted
        #      down to the floor with every gate green and check (1) silent (it
        #      fires only when the gap GROWS). `--high-water` is measured line
        #      coverage as of the PR that last raised it; the step exits 1 when
        #      measured falls >1.5pt (the script's DEFAULT_HIGH_WATER_TOLERANCE_
        #      POINTS — jitter absorption, not slack to spend) below it. Exceeding
        #      the mark only WARNS that it is stale, so a coverage-improving PR is
        #      never blocked by the ratchet protecting it. Bump this literal and
        #      RATCHET_HIGH_WATER in tests/test_coverage_floor_ratchet.py
        #      together — that test fails if they drift apart or if this step
        #      loses --fail-on-regression.
        if: always()
        run: |
          # #4252: the former single-file steps' labels, as sections (report only, exit 0),
          # read from EVERY leg's JUnit.
          python3 scripts/ci_test_sections.py shard-out/junit-parallel-1.xml shard-out/junit-parallel-2.xml shard-out/junit-serial.xml || true
          # #4252: the budget measures the test phase — from the EARLIEST leg's start.
          UNIT_TESTS_START_EPOCH=$(python3 -c 'import glob; v=[int(open(p).read()) for p in glob.glob("shard-out/start-*.epoch")]; print(min(v) if v else "")')
          DURATION_SECONDS=$(( $(date +%s) - ${UNIT_TESTS_START_EPOCH:-$(date +%s)} ))
          python3 scripts/coverage_gap_warn.py --coverage-xml coverage.xml --floor 82 --gap-threshold 10 \
              --duration-seconds "$DURATION_SECONDS" --duration-budget-seconds 1950 \
              --high-water 86.30 --fail-on-regression

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
        if: always()
