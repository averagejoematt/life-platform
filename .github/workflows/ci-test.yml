# Reusable: Unit Tests — the exhaustive offline suite (#1655)
# Extracted verbatim from ci-cd.yml's `test` job. NON-GATING for deploy (#416/ADR-117):
# the orchestrator wires nothing except notify-failure to this call, so a red here still
# flags main but no longer skips plan → deploy → visual-QA. Offline (no AWS), so
# `contents: read` suffices. build_sha (the #1173 reconciled tree) is passed in.
name: CI · Unit Tests

on:
  workflow_call:
    inputs:
      build_sha:
        description: 'The reconciled tree SHA to check out (#1173).'
        required: true
        type: string

# Reusable workflows do NOT inherit the caller's permissions — declare our own.
permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build_sha }}   # #1173: the reconciled tree

      # #1349: stamp the job's own start epoch so the duration-budget warning
      # below can compute wall-clock without depending on an external API call.
      # Kept BEFORE setup-python (unchanged ordering) so the measured window matches
      # the original job byte-for-behavior.
      - name: Record job start time (#1349 duration budget)
        run: echo "UNIT_TESTS_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      # setup-python (v7.0.0, cache: pip) via the shared composite (#1655)
      - uses: ./.github/actions/setup-ci
        with:
          python-cache: 'pip'  # V2 P4.14: speeds up CI by ~20s per job

      - name: Install test dependencies
        # Phase 8.2: pytest-cov for coverage report; hypothesis: property tests (#1664).
        # Versions are READ from requirements-dev.txt, never copied here (CQ-01, #2609) —
        # a second copy is what made every Dependabot bump born red.
        run: |
          # pillow (#2973): lets test_visual_ai_qa's real-downscale test run here
          # (visual_ai_qa._prepare_image; pytest.importorskip elsewhere).
          PINS=$(python3 scripts/ci_pins.py pytest pytest-cov boto3 botocore hypothesis pyyaml pillow)
          pip install $PINS

      - name: Run unit tests
        run: |
          echo "::group::Running tests/test_shared_modules.py"
          python3 -m pytest tests/test_shared_modules.py -v --tb=short
          echo "::endgroup::"

      - name: IAM policy linter (test_role_policies.py)
        run: |
          echo "::group::IAM policy linter"
          python3 -m pytest tests/test_role_policies.py -v --tb=short
          echo "::endgroup::"

      - name: CDK handler consistency linter (test_cdk_handler_consistency.py)
        run: |
          echo "::group::CDK handler consistency linter"
          python3 -m pytest tests/test_cdk_handler_consistency.py -v --tb=short
          echo "::endgroup::"

      - name: CDK S3 path linter (test_cdk_s3_paths.py)
        run: |
          echo "::group::CDK S3 path linter"
          python3 -m pytest tests/test_cdk_s3_paths.py -v --tb=short
          echo "::endgroup::"

      - name: Safety module wiring linter (test_wiring_coverage.py)
        run: |
          echo "::group::Wiring coverage linter"
          python3 -m pytest tests/test_wiring_coverage.py -v --tb=short
          echo "::endgroup::"

      - name: DynamoDB pattern linter (test_ddb_patterns.py)
        run: |
          echo "::group::DynamoDB pattern linter"
          python3 -m pytest tests/test_ddb_patterns.py -v --tb=short
          echo "::endgroup::"

      - name: MCP registry integrity linter (test_mcp_registry.py)
        run: |
          echo "::group::MCP registry integrity linter"
          python3 -m pytest tests/test_mcp_registry.py -v --tb=short
          echo "::endgroup::"

      - name: Lambda handler integration linter (test_lambda_handlers.py)
        # TB7-24: I1-I6 — file existence, syntax, handler signature, try/except, orphans, MCP entry point
        run: |
          echo "::group::Lambda handler integration linter"
          python3 -m pytest tests/test_lambda_handlers.py -v --tb=short
          echo "::endgroup::"

      - name: Deprecated secrets scan
        run: |
          echo "::group::Deprecated secrets scan"
          FAILED=0

          while IFS= read -r line; do
            secret=$(echo "$line" | sed 's/#.*//' | xargs)
            [ -z "$secret" ] && continue

            echo "Scanning for deprecated secret: $secret"
            MATCHES=$(grep -rn --include='*.py' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.sh' "$secret" \
              lambdas/ mcp/ cdk/ .github/ ci/ \
              --exclude-dir='.venv' --exclude-dir='cdk.out' \
              2>/dev/null | grep -v 'deprecated_secrets.txt' | grep -v '^Binary' || true)

            if [ -n "$MATCHES" ]; then
              echo "::error::Deprecated secret '$secret' still referenced:"
              echo "$MATCHES" | head -20
              FAILED=$((FAILED + 1))
            else
              echo "  ✅ No references to '$secret'"
            fi
          done < ci/deprecated_secrets.txt

          echo "::endgroup::"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED deprecated secret(s) still referenced. Update to current secret names before merging."
            exit 1
          fi
          echo "✅ Deprecated secrets scan passed"

      - name: IAM/secrets consistency linter (test_iam_secrets_consistency.py)
        # R8-8: Cross-refs IAM secret ARN patterns against known-secrets list
        run: |
          echo "::group::IAM/secrets consistency linter"
          python3 -m pytest tests/test_iam_secrets_consistency.py -v --tb=short
          echo "::endgroup::"

      - name: Secret references linter (test_secret_references.py)
        # R13-F04: Validates Lambda source secret name literals against known-secrets list.
        # Prevents Todoist-style 2-day outage caused by wrong SECRET_NAME default value.
        run: |
          echo "::group::Secret references linter"
          python3 -m pytest tests/test_secret_references.py -v --tb=short
          echo "::endgroup::"

      - name: Upstream-API contract tests (test_upstream_contracts.py)
        # ER-02: assert each active source's transform contract against committed,
        # scrubbed fixtures (tests/fixtures/upstream/**). Catches vendor payload
        # drift (field rename/renest/retype) before it corrupts data at 4 AM.
        # Fully offline — no live AWS/vendor calls; the live-refresh path is
        # deploy/refresh_upstream_fixtures.py (run by hand, with creds).
        run: |
          echo "::group::Upstream-API contract tests (ER-02)"
          python3 -m pytest tests/test_upstream_contracts.py -v --tb=short
          echo "::endgroup::"

      # #2259: the standalone "Full test suite" step that used to sit here ran the
      # EXACT same selection as the coverage gate below (`tests/` minus
      # test_integration_aws.py) — the whole suite, twice, 493s + 705s = 1228s against
      # a 1200s budget. It was deleted rather than parallelised: no new dependency, no
      # xdist, ~42% off this job's wall-clock.
      #
      # The pre-merge half of this pair lives in pr-checks.yml, which selects the
      # `premerge` marker (tests/conftest.py auto-applies it to the behaviour suite +
      # everything deploy_critical). Both lanes name that ONE marker on purpose:
      # tests/test_premerge_lane.py fails if either stops referencing it, which is what
      # stops the two lanes silently diverging the way they did before #2258.
      #
      # It was only safe to delete once the `pipefail` bug below was fixed. Until then
      # the coverage step's `| tail -100` swallowed pytest's exit code (GitHub's default
      # shell is `bash -e {0}` — `-e` does NOT imply pipefail), so the deleted step was
      # the ONLY one on main whose test failures could actually red the build. Removing
      # it without the fix would have left main with no test signal at all while
      # continuing to report green.

      - name: Test coverage gate (regression floor, ADR-080)
        # ENFORCED regression floor. The codebase is integration-tested (handlers
        # run live; most offline tests are structural/contract), so measured offline
        # line coverage is 79.02% (read out of this job's own output on green main
        # e806d7e4 / run 31274908729, after #1658's fourth tranche; the third took it
        # from 70.50% to 78.24% — +7.74pt / 5,565 newly-covered statements across 15
        # modules that sat at 0-72%). The --high-water mark below is banked at 83.20,
        # a tenth of a point UNDER measured on purpose — the mark is a floor for real
        # coverage, so rounding it down costs nothing and buys jitter margin. This floor (74%) prevents BACKSLIDING with ~5.0pt
        # headroom under measured so normal fluctuation doesn't red main — it is
        # not a quality bar, and it is no longer the tightest gate either: step (3)
        # below polices measured coverage directly at 78.90 - 1.5 = 77.40%.
        # NB #1658's third acceptance box ("enforce 70% as the merge gate") is now
        # SATISFIED: the enforced merge gate is 74, comfortably above 70, and it is
        # set from a measurement (78.24) rather than a target.
        # Ratcheted 40→47 by #1658, 47→53 by #2152, 53→58 by #1658's first test
        # tranche, 58→66 by its second, 66→74 by its third (lineage: #419 9%→25%, #1206 25→40); keep ratcheting up
        # (ADR-080/ADR-107). The floor is CANONICAL in
        # pyproject.toml `[tool.coverage.report] fail_under`; the explicit
        # `--cov-fail-under` below is belt-and-suspenders and MUST match it —
        # tests/test_coverage_floor_ratchet.py fails if the two (and the gap-warn
        # --floor below) ever drift or drop below the committed RATCHET_FLOOR
        # (up-only). The gap-warning step below reminds a human to ratchet when the
        # floor drifts >10pts under measured. Scope: lambdas/ + mcp/ only.
        run: |
          # `set -o pipefail` is LOAD-BEARING (#2259). GitHub's default shell is
          # `bash -e {0}`; `-e` does not imply pipefail, so `pytest … | tail -100`
          # exited with tail's status (always 0). Both `--cov-fail-under=74` AND every
          # test failure in this step were therefore silently discarded — this gate has
          # never once failed a build. Proven locally:
          #   bash -e -c 'python3 -c "import sys; sys.exit(1)" | tail -100'; echo $?  → 0
          # Do not remove this line, and do not add another unguarded pipe below it.
          set -o pipefail
          echo "::group::Coverage report + gate"
          # #2692: --durations=25 so the NEXT run can answer "which tests" rather than
          # only "how long". The wall-clock budget has now been breached four times and
          # every diagnosis so far has been local, where the suite behaves differently
          # from this runner — the local/CI gap is half of what the issue asks to
          # explain, and it cannot be closed from a laptop. This is display-only: no
          # selection, no threshold, no gate behaviour changes.
          #
          # tail widened 100 -> 160 with it. The durations block prints in pytest's
          # terminal summary alongside the (long) coverage table, so at -100 the very
          # lines this flag exists to produce were the ones most likely to be cut —
          # a measurement that silently truncates reports nothing, which is the
          # failure mode this repo keeps re-learning.
          python3 -m pytest tests/ \
              --ignore=tests/test_integration_aws.py \
              --cov=lambdas --cov=mcp \
              --cov-report=term-missing:skip-covered \
              --cov-report=xml:coverage.xml \
              --cov-fail-under=74 \
              --durations=25 \
              -q 2>&1 | tail -160
          echo "::endgroup::"

      - name: Coverage regression gate + drift warnings (ratchet, #1206/#1349/#1658)
        # THREE checks in one script. (1) and (2) are advisory/fail-open and never
        # fail the build; (3) is ENFORCING (`--fail-on-regression`) but still
        # fail-open on a missing/unparseable coverage.xml, so keep `if: always()`:
        #  (1) #1206: parses coverage.xml's line-rate and emits a GitHub
        #      ::warning:: when the enforced floor lags measured line coverage
        #      by >10 points, so the ratchet reminds a human to bump it.
        #  (2) #1349/#1966/#2152: computes this job's own wall-clock from the
        #      start-epoch stamped above and warns when it exceeds the budget
        #      below — same self-reminding-ratchet shape, applied to suite cost.
        #      BUDGET DERIVATION (#2152, 2026-08-06 — measure-first, not
        #      plucked): #1966 raised 480->900s from a 6-run sample hours before
        #      the same session merged ~200 more tests, breaching the new budget
        #      (985s) within the day — proof a budget derived from one point-in-
        #      time sample goes stale fast under this suite's growth rate. This
        #      re-derivation samples EVERY green-main "Unit Tests" job run in the
        #      post-#2132 era (8 runs, 2026-08-05/06, via the GitHub API):
        #      704s/945s/745s/745s/922s/764s/985s/833s (avg ~830s, max 985s) —
        #      the max alone already exceeds the 900s budget it's replacing.
        #      1200s (20min) = ~22% headroom above the observed max / ~45% above
        #      the average — enough to absorb several more weeks of the same
        #      honest growth curve without flapping on every green run, while
        #      still catching a genuine future regression (e.g. an unmocked
        #      wait a new test accidentally introduces). The #1966
        #      standing-warning triage gate (`scripts/check_ci_warnings.py`,
        #      /wrap step (e11)) still obligates a same-session decision the
        #      next time this fires. #3025 (2026-08-23) re-derived again from
        #      CI's own --durations measurement, moving 1200 -> 1500.
        #      #3106 (2026-08-24, ADR-105 measure-first): the 1500s budget bred
        #      the exact same class a third time — the D2 session's ~230 new
        #      tests breached it on green main (1507s, 7s over) within the
        #      day. Sampled ALL 10 green-main "test / Unit Tests" runs since
        #      #3025 landed 1500s (GitHub API, runs 32637512129..32762278235,
        #      2026-08-23 11:50 -> 2026-08-24 18:29): 1175/1022/1179/1204/
        #      1358/1580/1255/1305/1467/1507s (avg ~1305s, max 1580s) — TWO of
        #      those 10 already breached 1500s outright, a 20% breach rate on
        #      a budget that had JUST been raised. `--durations=25` on the
        #      current run (21,146 tests) shows no single test over 51s and no
        #      dominating outlier: the top 5 are all
        #      tests/test_platform_model_drift.py (50.07/27.31/27.24/25.03/
        #      24.89s ≈ 154s total) — the same known generation/drift family
        #      #3025 already priced, asserting real generated artifacts, not a
        #      slow-test mistake to trim. Honest broad growth again: applying
        #      the same ~23% above-observed-max headroom #1966/#2152/#3025
        #      each used (1580 * 1.23 ≈ 1943s), the budget moved 1500 -> 1950
        #      (~49% above the 10-run average, ~23% above the observed max).
        #      #3224 (2026-08-27) IS THE FIRST INSTANCE OF THIS CLASS NOT
        #      ANSWERED BY A RAISE, and the number below is deliberately
        #      UNCHANGED at 1950 despite a 1994s breach on green main
        #      (678a0598, run 33030125667). Reading the two runs' own
        #      --durations blocks against each other showed the growth is NOT
        #      mostly new tests: +1,120 tests (+5.3%) but +482s (+32.9%), i.e.
        #      mean cost per test rose 26.2%. The dominant term is duplicated
        #      whole-repo scans — `check_doc_facts.py` went 7.29s -> 15.41s
        #      between the two shas (reproduced locally at both), 8.09s of the
        #      new cost being the gate census #3126/#3156 put on the
        #      auto-discovery path, and THREE tests ran that identical scan.
        #      The breach was paid for by sharing those spawns
        #      (tests/repo_scan_cache.py) instead of by moving this literal.
        #      Read tests/test_duration_budget_ratchet.py's docstring — it now
        #      holds the whole class record plus a HARD_CEILING_SECONDS the
        #      budget may not be raised past — BEFORE editing this number.
        #  (3) #1658: the MEASURED-coverage high-water ratchet — the only check
        #      here that can red the build. `--cov-fail-under` above is set a few
        #      points BELOW measured on purpose (anti-flap headroom), and until
        #      now that headroom was unguarded: real coverage could be deleted
        #      down to the floor with every gate green and check (1) silent (it
        #      fires only when the gap GROWS). `--high-water` is measured line
        #      coverage as of the PR that last raised it; the step exits 1 when
        #      measured falls >1.5pt (the script's DEFAULT_HIGH_WATER_TOLERANCE_
        #      POINTS — jitter absorption, not slack to spend) below it. Exceeding
        #      the mark only WARNS that it is stale, so a coverage-improving PR is
        #      never blocked by the ratchet protecting it. Bump this literal and
        #      RATCHET_HIGH_WATER in tests/test_coverage_floor_ratchet.py
        #      together — that test fails if they drift apart or if this step
        #      loses --fail-on-regression.
        if: always()
        run: |
          DURATION_SECONDS=$(( $(date +%s) - "${UNIT_TESTS_START_EPOCH:-$(date +%s)}" ))
          python3 scripts/coverage_gap_warn.py --coverage-xml coverage.xml --floor 74 --gap-threshold 10 \
              --duration-seconds "$DURATION_SECONDS" --duration-budget-seconds 1950 \
              --high-water 83.20 --fail-on-regression

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
        if: always()
