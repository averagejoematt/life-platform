# pr-checks.yml — the minimal ADVISORY pre-merge lane (ADR-139, #1344).
#
# Fast checks (~2 min total) on every PR, killing the documented agent-merge
# failure classes at the door:
#   1. pytest --collect-only  — the #1297 collection-error class
#   2. the `premerge` marker lane — the behaviour suite + deploy_critical + (since
#      2026-08-09) the structural gates, all selected by ONE marker defined in
#      tests/conftest.py so the two lanes cannot drift
#   3. mypy on the tier-2 clean set — same command + pin as ci-lint.yml
#   4. black --check and ruff check — the format/lint gates (same pins as ci-lint.yml)
#
# WHY 3 AND 4 ARE HERE (2026-08-09). Everything in ci-lint.yml and ci-test.yml runs
# only AFTER a merge. On 2026-08-08 main went red four times in one session and every
# red was one of these gates — a `var-annotated` mypy error twice, and two module-size
# ceilings — each knowable from the PR's own diff, each costing 20-70 minutes of driver
# time to find and fix on main. Cost of moving them left: ~0.3s (mypy, warm) + ~2s
# (the structural gates) + ~1s (ruff).
#
# REQUIRED since #1662 / ADR-148. This job's `name:` below IS the required
# check-run context (`Collect + deploy-critical + format`) in the
# `main-required-fast-lane` ruleset. Three edits to this file would silently
# un-require it and leave every PR stuck on "Expected — Waiting for status to
# be reported": renaming the job's `name:`, adding a `paths:` filter to the
# pull_request trigger, or adding a job-level `if:`. Do none of those without
# updating deploy/github_posture.json and re-running
# `python3 scripts/apply_branch_protection.py --apply`.
# tests/test_branch_protection_spec.py reds if you try.
#
# The durable control is still this file (in git) — the #1319 incident proved
# GitHub-side settings silently drop on repo-visibility flips, which is exactly
# why the required-ness is declared in deploy/github_posture.json and
# GET-verified weekly by drift_sentinel rather than trusted to stay set.
# ADR-139's advisory posture is superseded for THIS lane only; the full suite
# stays post-merge and advisory.
#
# The reconcile bot pushes directly to main. A required-status-checks rule DOES
# block direct pushes, so the ruleset carries a `github-actions` Integration
# bypass for exactly that push — see ADR-148.

name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  fast-lane:
    name: Collect + deploy-critical + format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-python (v7.0.0, cache: pip) via the shared composite (#1655)
      - uses: ./.github/actions/setup-ci
        with:
          python-cache: 'pip'

      # DEP PARITY WITH ci-test.yml IS LOAD-BEARING (#2258). This lane previously
      # omitted pyyaml, which ci-test.yml installs. A module importing yaml INSIDE a
      # function is invisible to `--collect-only`, so the missing dep was undetectable
      # pre-merge and red-mained main on landing (2026-08-08). Keep this list equal to
      # ci-test.yml's install step (minus pytest-cov, which only the coverage job needs);
      # tests/test_premerge_lane.py asserts the two stay in sync.
      - name: Install lane dependencies
        # Versions are READ from requirements-dev.txt, never copied here (CQ-01, #2609).
        run: |
          PINS=$(python3 scripts/ci_pins.py pytest boto3 botocore black hypothesis pyyaml mypy ruff)
          pip install $PINS

      # `if: always()` from here down — the #749 lesson, applied to this lane. Sequential
      # gates mean the FIRST red masks every gate after it, so an agent fixes black,
      # discovers mypy, fixes mypy, discovers the size ceiling: one push per layer. Each
      # gate's own non-zero exit still fails the job, so gating is unchanged.
      - name: Collection gate (the #1297 class dies here)
        if: always()
        run: python3 -m pytest tests/ --collect-only -q

      # #2258: the pre-merge lane must not be a strict SUBSET of the post-merge one.
      # `premerge` is applied automatically by tests/conftest.py to every
      # tests/*_behavior.py test PLUS everything deploy_critical — so this is a strict
      # superset of the old ADR-117 subset, not a swap. ~6,075 tests in ~30s (measured
      # 2026-08-08) against this job's timeout-minutes: 10.
      #
      # The marker's THIRD source (2026-08-09) is tests/conftest.py's
      # `_PREMERGE_EXTRA_FILES` — the structural gates (both size ceilings, the two
      # registries a new module must join, the mypy clean set) that ran nowhere until
      # after a merge and red-mained main four times on 2026-08-08. They cost 1.98s
      # locally for all 66 tests. No workflow edit was needed to add them: one marker,
      # one selection, which is exactly the property #2258 bought.
      - name: Pre-merge test lane (premerge marker — behaviour + deploy-critical + structural gates)
        if: always()
        run: python3 -m pytest tests/ -m "premerge and not integration" -q --tb=short

      # The SAME command ci-lint.yml's "Mypy gate" runs, against the same authoritative
      # module list (tests/mypy_clean_set.py). It is duplicated as an explicit step rather
      # than left to test_mypy_clean_modules.py because that test carries a
      # `skipif(not _mypy_available())` — in a lane without mypy installed it would report
      # green while checking nothing, which is the one failure shape this repo keeps
      # re-learning. Measured 0.31s warm; ~30-60s cold on a runner.
      - name: Mypy gate (tier-2 clean set — same command + pin as ci-lint.yml)
        if: always()
        run: python3 -m mypy --config-file mypy.ini $(python3 tests/mypy_clean_set.py)

      - name: Format gate (same pin as ci-cd lint)
        if: always()
        run: black --check lambdas/ mcp/ cdk/ tests/ scripts/ deploy/

      # Same class as the mypy gate above: ENFORCED in ci-lint.yml, invisible on a PR.
      # The full six-directory set is load-bearing — running a subset locally is how a
      # ruff red reaches main.
      - name: Lint gate (ruff — same command + pin as ci-lint.yml)
        if: always()
        run: ruff check lambdas/ mcp/ cdk/ tests/ scripts/ deploy/

      # #2632. THE ONE CLASS EVERY GATE ABOVE IS STRUCTURALLY BLIND TO. tests/conftest.py
      # puts lambdas/ AND each subpackage on sys.path so flat-name imports keep resolving,
      # so a stale `import ai_calls` left behind by a packaging move passes collection,
      # passes the premerge lane, passes mypy — and raises ImportError on the Lambda. This
      # step stages the real bundle and imports all 397 modules in a subprocess whose only
      # first-party sys.path entry is the bundle root, which is what /var/task actually is.
      # Same script also runs on the deploy path (deploy/build_bundle.py, default-ON);
      # this copy is the pre-merge early warning so the failure reaches a human first.
      # Measured 4.0s in exactly this lane's dependency set. --compare suppresses the 4
      # Pillow-from-a-layer modules this lane cannot import; see the baseline file.
      - name: Bundle-boot gate (every module imports out of a STAGED bundle)
        if: always()
        run: python3 scripts/verify_bundle_boot.py --compare deploy/bundle_boot_baseline.json
