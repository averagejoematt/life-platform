# pr-checks.yml — the minimal ADVISORY pre-merge lane (ADR-139, #1344).
#
# Fast checks (~2 min total) on every PR, killing the documented agent-merge
# failure classes at the door:
#   1. pytest --collect-only  — the #1297 collection-error class
#   2. the `premerge` marker lane — the behaviour suite + deploy_critical + (since
#      2026-08-09) the structural gates, all selected by ONE marker defined in
#      tests/conftest.py so the two lanes cannot drift
#   3. mypy on the tier-2 clean set — same command + pin as ci-lint.yml
#   4. black --check and ruff check — the format/lint gates (same pins as ci-lint.yml)
#
# WHY 3 AND 4 ARE HERE (2026-08-09). Everything in ci-lint.yml and ci-test.yml runs
# only AFTER a merge. On 2026-08-08 main went red four times in one session and every
# red was one of these gates — a `var-annotated` mypy error twice, and two module-size
# ceilings — each knowable from the PR's own diff, each costing 20-70 minutes of driver
# time to find and fix on main. Cost of moving them left: ~0.3s (mypy, warm) + ~2s
# (the structural gates) + ~1s (ruff).
#
# REQUIRED since #1662 / ADR-148. This job's `name:` below IS the required
# check-run context (`Collect + deploy-critical + format`) in the
# `main-required-fast-lane` ruleset. Three edits to this file would silently
# un-require it and leave every PR stuck on "Expected — Waiting for status to
# be reported": renaming the job's `name:`, adding a `paths:` filter to the
# pull_request trigger, or adding a job-level `if:`. Do none of those without
# updating deploy/github_posture.json and re-running
# `python3 scripts/apply_branch_protection.py --apply`.
# tests/test_branch_protection_spec.py reds if you try.
#
# The durable control is still this file (in git) — the #1319 incident proved
# GitHub-side settings silently drop on repo-visibility flips, which is exactly
# why the required-ness is declared in deploy/github_posture.json and
# GET-verified weekly by drift_sentinel rather than trusted to stay set.
# ADR-139's advisory posture is superseded for THIS lane only; the full suite
# stays post-merge and advisory.
#
# The reconcile bot pushes directly to main. A required-status-checks rule DOES
# block direct pushes, so the ruleset carries a `github-actions` Integration
# bypass for exactly that push — see ADR-148.

name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  fast-lane:
    name: Collect + deploy-critical + format
    runs-on: ubuntu-latest
    # 10 -> 15 (2026-08-24, Session A): the lane crossed its 10m ceiling and GitHub
    # reported the timeout as `cancelled`, which reads as an external cancellation
    # rather than a budget breach (3 PRs hit it in one evening: 9m27s pass earlier
    # that day, then 10m0s kills). Same headroom idiom as the #3134 suite-budget
    # re-derivation: observed max ~10m x 1.23 + the session's own test growth -> 15m.
    # Re-measure before trusting this number again; do not bump silently.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-python (v7.0.0, cache: pip) via the shared composite (#1655)
      - uses: ./.github/actions/setup-ci
        with:
          python-cache: 'pip'

      # DEP PARITY WITH ci-test.yml IS LOAD-BEARING (#2258). This lane previously
      # omitted pyyaml, which ci-test.yml installs. A module importing yaml INSIDE a
      # function is invisible to `--collect-only`, so the missing dep was undetectable
      # pre-merge and red-mained main on landing (2026-08-08). Keep this list equal to
      # ci-test.yml's install step (minus pytest-cov, which only the coverage job needs);
      # tests/test_premerge_lane.py asserts the two stay in sync.
      - name: Install lane dependencies
        # Versions are READ from requirements-dev.txt, never copied here (CQ-01, #2609).
        run: |
          PINS=$(python3 scripts/ci_pins.py pytest boto3 botocore black hypothesis pyyaml mypy ruff pillow)
          pip install $PINS

      # `if: always()` from here down — the #749 lesson, applied to this lane. Sequential
      # gates mean the FIRST red masks every gate after it, so an agent fixes black,
      # discovers mypy, fixes mypy, discovers the size ceiling: one push per layer. Each
      # gate's own non-zero exit still fails the job, so gating is unchanged.
      - name: Collection gate (the #1297 class dies here)
        if: always()
        run: python3 -m pytest tests/ --collect-only -q

      # #2258: the pre-merge lane must not be a strict SUBSET of the post-merge one.
      # `premerge` is applied automatically by tests/conftest.py to every
      # tests/*_behavior.py test PLUS everything deploy_critical — so this is a strict
      # superset of the old ADR-117 subset, not a swap. 8,813 tests in 155s (measured
      # locally 2026-08-21, #2924) against this job's timeout-minutes: 10. The prior
      # "~6,075 in ~30s" here was an 2026-08-08 measurement left to go stale as the
      # lane grew; re-measure before adding anything slow rather than trusting it.
      #
      # The marker's THIRD source (2026-08-09) is tests/conftest.py's
      # `_PREMERGE_EXTRA_FILES` — the structural gates (both size ceilings, the two
      # registries a new module must join, the mypy clean set) that ran nowhere until
      # after a merge and red-mained main four times on 2026-08-08. They cost 1.98s
      # locally for all 66 tests. No workflow edit was needed to add them: one marker,
      # one selection, which is exactly the property #2258 bought.
      - name: Pre-merge test lane (premerge marker — behaviour + deploy-critical + structural gates)
        if: always()
        # `set -o pipefail` is LOAD-BEARING (#2746 class, caught by
        # tests/test_gate_steps_cannot_swallow_status_2746.py): #2692 added the `| tee`
        # so the deselection reporter below can read the summary line, and without
        # pipefail this enforcing step exits with tee's status — 0 — so the whole
        # pre-merge lane reports SUCCESS on failing tests. A gate that cannot fail is a
        # green light wired to nothing.
        run: |
          set -o pipefail
          python3 -m pytest tests/ -m "premerge and not integration" -q --tb=short | tee /tmp/premerge_lane_output.txt

      # #2692: the gap this closes is not "the lane is slow", it's that a green PR
      # check gave no signal about what it did NOT run — PR #2884 merged 7/7 green
      # here and red-mained main twice on tests this lane never selected. Pytest's
      # own summary line already reports the deselected count for free (no extra
      # collection pass needed) whenever a marker excludes items, so this step is
      # just a parse + a step-summary line — the durable instrument, cheap because
      # it rides the test lane step above rather than re-running collection.
      - name: Report pre-merge deselection (#2692 — a green check states what it skipped)
        if: always()
        run: |
          python3 scripts/report_premerge_deselection.py /tmp/premerge_lane_output.txt >> "$GITHUB_STEP_SUMMARY"

      # The SAME command ci-lint.yml's "Mypy gate" runs, against the same authoritative
      # module list (tests/mypy_clean_set.py). It is duplicated as an explicit step rather
      # than left to test_mypy_clean_modules.py because that test carries a
      # `skipif(not _mypy_available())` — in a lane without mypy installed it would report
      # green while checking nothing, which is the one failure shape this repo keeps
      # re-learning. Measured 0.31s warm; ~30-60s cold on a runner.
      - name: Mypy gate (tier-2 clean set — same command + pin as ci-lint.yml)
        if: always()
        run: python3 -m mypy --config-file mypy.ini $(python3 tests/mypy_clean_set.py)

      - name: Format gate (same pin as ci-cd lint)
        if: always()
        run: black --check lambdas/ mcp/ cdk/ tests/ scripts/ deploy/

      # Same class as the mypy gate above: ENFORCED in ci-lint.yml, invisible on a PR.
      # The full six-directory set is load-bearing — running a subset locally is how a
      # ruff red reaches main.
      - name: Lint gate (ruff — same command + pin as ci-lint.yml)
        if: always()
        run: ruff check lambdas/ mcp/ cdk/ tests/ scripts/ deploy/

      # #2632. THE ONE CLASS EVERY GATE ABOVE IS STRUCTURALLY BLIND TO. tests/conftest.py
      # puts lambdas/ AND each subpackage on sys.path so flat-name imports keep resolving,
      # so a stale `import ai_calls` left behind by a packaging move passes collection,
      # passes the premerge lane, passes mypy — and raises ImportError on the Lambda. This
      # step stages the real bundle and imports all 397 modules in a subprocess whose only
      # first-party sys.path entry is the bundle root, which is what /var/task actually is.
      # Same script also runs on the deploy path (deploy/build_bundle.py, default-ON);
      # this copy is the pre-merge early warning so the failure reaches a human first.
      # Measured 4.0s in exactly this lane's dependency set. --compare suppresses the 4
      # Pillow-from-a-layer modules this lane cannot import; see the baseline file.
      - name: Bundle-boot gate (every module imports out of a STAGED bundle)
        if: always()
        run: python3 scripts/verify_bundle_boot.py --compare deploy/bundle_boot_baseline.json

  # ════════════════════════════════════════════════════════════════
  # FULL UNIT SUITE, PRE-MERGE (#3025) — the premerge marker selects 8,813 of
  # 20,509 tests, so a PR redding only the deselected ~11,700 read 7/7 green and
  # redded main on landing: ≥4 occurrences in 5 days (08-18 ×2, #2907,
  # #3013→#3020), 1-2.5h TTR each, always misattributed to merge order. This job
  # is the same selection as ci-test.yml's coverage gate MINUS coverage
  # instrumentation (~1.4x overhead per the #2259 measurement, and the floor is a
  # post-merge concern): ~16 min, parallel across PRs, no serialization — chosen
  # over a merge queue (11 merges × ~24 min serialized on a session day) and over
  # impact-selection (whose selection logic is this same class one level up).
  # tests/test_full_suite_premerge_3025.py pins selection + dep parity with
  # ci-test.yml. UNPIPED on purpose: `pytest ... | tail` exits with tail's
  # status (the gate-that-cannot-fail class).
  #
  # Blocking-by-rollup on landing (any red blocks the driver's merge discipline
  # and remediation automerge alike). Promotion to a REQUIRED check in the
  # main-required-fast-lane ruleset (deploy/github_posture.json +
  # apply_branch_protection --apply, the ADR-148 path) is deliberately deferred
  # until it has run clean across the #3025 observation window — a 16-minute
  # required check earns required-ness by not flaking first.
  # ════════════════════════════════════════════════════════════════
  full-suite:
    name: Full unit suite (pre-merge, #3025)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-ci
        with:
          python-cache: 'pip'

      - name: Install lane dependencies
        # DEP PARITY WITH ci-test.yml (#2258/#3013): identical pin list minus
        # pytest-cov (no coverage here). Versions read from requirements-dev.txt
        # (CQ-01, #2609). tests/test_full_suite_premerge_3025.py asserts parity.
        run: |
          PINS=$(python3 scripts/ci_pins.py pytest boto3 botocore hypothesis pyyaml pillow)
          pip install $PINS

      # The doc-sync literals (test_count et al.) are DRIVER-reconciled on main by
      # policy — a branch must never stamp them (#2372's collision class), yet the
      # full suite contains the tests that assert them. Applying the sync IN THE
      # RUNNER'S WORKSPACE (never committed) makes those tests assert the
      # post-reconcile reality this branch will actually have on main, with zero
      # selection divergence from the post-merge lane. First observed on this
      # job's own maiden run: 4 literal-treadmill fails on PR #3026 itself.
      - name: Reconcile doc literals in-workspace (never committed)
        if: always()
        run: python3 deploy/sync_doc_metadata.py --apply

      - name: Full unit suite (same selection as the post-merge coverage gate)
        if: always()
        run: python3 -m pytest tests/ --ignore=tests/test_integration_aws.py -q --tb=short --durations=25

  # ════════════════════════════════════════════════════════════════
  # #2831 — API-before-frontend sequencing check.
  #
  # site/** merges auto-deploy with NO approval gate (#750); site-api's
  # deploy is a separate pipeline behind manual production approval. A PR
  # that adds a new site-api route AND the site/ page consuming it in the
  # SAME PR has fired this class >=5 times (docs/INCIDENT_LOG.md: 07-09 #900
  # x2 rollbacks, 07-12, 07-19, 07-23 #1704 "a recurrence of the 2026-07-09
  # class", 08-02 #2040) with only reflex-level fixes each time. This job is
  # the first PRE-merge machinery — see scripts/check_api_before_frontend.py
  # for the full mechanism and deploy/api_deploy_sequencing.json for the
  # declaration registry it (and tests/visual_qa.py + deploy/smoke_test_site.sh's
  # runtime deferral) reads.
  #
  # ADVISORY, not required, on landing (ADR-139 default posture) — promoting
  # it to a required check needs deploy/github_posture.json +
  # `python3 scripts/apply_branch_protection.py --apply`, an owner action;
  # see the header of the `fast-lane` job above for why that file is the one
  # to edit, never branch-protection settings by hand.
  # ════════════════════════════════════════════════════════════════
  api-before-frontend:
    name: API-before-frontend sequencing check (#2831)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history: needs a real merge-base diff against origin/main

      - name: Check API-before-frontend sequencing
        # #749: every pre-merge gate step reports independently — without this an
        # earlier red masks it, and a gate whose verdict can be swallowed is the
        # exact "reads green while telling you nothing" class #2831 exists to close.
        # Enforced by tests/test_premerge_lane.py::test_the_lane_gates_report_independently.
        if: always()
        run: python3 scripts/check_api_before_frontend.py --base-ref "origin/${{ github.base_ref }}" --head-ref HEAD
