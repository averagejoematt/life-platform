# Resume a deferred site deploy once the Site API it waited on is live (2026-11-12, run 43124939822).
#
# BOTH site paths — web-preview-deploy.yml (v9) and site-deploy.yml (legacy site/**, /coaching/ …) — DEFER
# (sync nothing, roll nothing back) when the live Site API bundle lacks the commit the Site API owes; that
# code ships only via CI's fleet deploy or a laptop deploy/deploy_site_api.sh. This closes the loop: for
# each TARGET (deploy/www_api_readiness.py) whose newest decisive run is a deferral, once the API is ready,
# it dispatches ONE deploy of that workflow.
#
#   workflow_run  every CI/CD completion on main — the fleet deploy is the usual way the API lands
#   schedule      the backstop: a laptop deploy whose own `resume` call failed, a cdk deploy, or a race
#                 with an in-flight run; also the dead-man — a deferral streak older than STALE_DEFERRAL_HOURS reds it
#
# A SEPARATE workflow, deliberately: inside web-preview-deploy.yml a trigger on every CI/CD completion
# would share the `v9-deploy` concurrency group and could displace a pending real deploy; inside
# ci-cd.yml it would grow the ratcheted file and run before CI's own smoke/rollback had settled.
# Read-only AWS (lambda:GetFunction); the only writes are the dispatches. Logic + tests: deploy/www_api_readiness.py,
# tests/test_www_api_readiness.py.

name: Site deploy resume (v9 + site/**, after the Site API lands)

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC → the read-only role (lambda:GetFunction for the live build sha)
  actions: write    # read both run histories; dispatch web-preview-deploy.yml / site-deploy.yml

concurrency:
  group: web-deploy-resume
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "205930651321"
  AWS_REGION: us-west-2

jobs:
  resume:
    name: Resume deferred site deploys (v9 + site/**)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0   # the owed commit is git history; the script refuses a shallow clone
      - uses: ./.github/actions/setup-ci
        with:
          aws-role: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-readonly-role
          aws-region: ${{ env.AWS_REGION }}
      - name: Dispatch each deferred deploy if the Site API is now ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/www_api_readiness.py resume
