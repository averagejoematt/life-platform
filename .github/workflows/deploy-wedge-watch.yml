# Deploy-wedge watch (#2052) — the fifth-recurrence escape hatch.
#
# WHY THIS IS A SEPARATE WORKFLOW, NOT A JOB IN ci-cd.yml:
# it has to observe ci-cd.yml from OUTSIDE. The wedged run is one whose own jobs can
# never start — a job inside it could not report on it, and a job in a later ci-cd run
# would queue behind the very same group. This workflow shares nothing with ci-cd.yml:
# no concurrency group of its own (see below), no environment, no AWS.
#
# NO `concurrency:` BLOCK HERE, DELIBERATELY. A watchdog for a stuck concurrency queue
# must not own a concurrency queue. Overlapping runs of this workflow are harmless —
# it is read-only unless explicitly asked to recover.
#
# LOUDNESS: on a phantom wedge the job FAILS. A red scheduled workflow is the repo's
# existing "email the owner" channel, and the failure body carries the full decode plus
# the exact recovery command — the operator should never have to re-derive it at 2am.
#
# It does NOT deploy. The recovery path re-dispatches ci-cd.yml, which still stops at
# the production approval gate like any other run.
#
# LAST-MILE ALERTING (#2149): a red scheduled run turned out to be a passive channel —
# the 2026-08-05 wedge went red 6x over ~9h with no email/page. `--alert` (below) fires
# on a CONFIRMED wedge only, via `repository_dispatch` `urgent_alarm` — the SAME event
# `remediation-agent.yml` already listens for on urgent CloudWatch alarms, so it reuses
# that curated-email path rather than adding one. Throttled to one alert per episode via
# a GitHub issue marker (scripts/check_deploy_wedge.py's alert_candidate/should_fire_
# alert/maybe_alert — offline-tested in tests/test_deploy_wedge_alert_2149.py); it holds
# no AWS credentials for this and gains none — `contents: write` (dispatch the event) and
# `issues: write` (the throttle marker) below are the only permission additions.
#
# SCHEDULED HEAD-COVERAGE CHECK (#2826): `scripts/check_main_green.py::head_coverage()`
# (#2762) detects the swallowed-push shape — a push to main that mints ZERO CI/CD runs —
# but until this step it only ever ran inside a session's `/wrap` gate, so an unattended
# merge (dependabot-automerge, remediation automerge) whose push was swallowed had no
# detector until a human happened to run it. This cron is the natural scheduled home:
# read-only, no AWS, same "red scheduled run pages the owner" channel as the wedge check
# above. `--head-coverage-check` tells a GENUINE swallow apart from an ORDINARY
# path-filter skip (ci-cd.yml's own `paths:` filter legitimately declining a docs-only or
# handover-only push) — proven live in the session that added this: main's HEAD 8cbf075f
# read `uncovered` for ci-cd.yml (neither of its two files is in the filter) while `Docs
# CI` had run at that exact sha. Wiring the naive "uncovered ⇒ page" version would fire on
# every docs-only/wrap commit — most of them — and be muted inside a week. Three-way exit
# code (0 OK / 1 CONFIRMED swallow / 2 indeterminate — an API read failed, so neither
# verdict was provable) so the check itself cannot fail dark (#2753 class): both 1 and 2
# fail this job, with visibly DIFFERENT step names and step-summary content, so an
# operator glancing at the run instantly knows "swallowed push, page" from "the check
# broke, decode manually" rather than reading one red run as the other.

name: Deploy wedge watch

on:
  schedule:
    # Every 15 minutes. The wedge is only harmful while the tree it would deploy is
    # still current; the 2026-08-02 recurrence was cancelled at 17 minutes holding a
    # stale sha. 15 minutes bounds the blind window below that.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      recover:
        description: 'Run the documented recovery if a phantom wedge is CONFIRMED (cancel + re-dispatch ci-cd.yml with deploy_all=true)'
        required: false
        type: boolean
        default: false
      threshold:
        description: 'Minutes a Deploy may sit blocked with nothing holding the group before alarming'
        required: false
        type: string
        default: '10'

permissions:
  contents: write  # read run/job state; #2149: also required to POST repos/.../dispatches (repo scope equivalent)
  actions: write   # `recover` cancels the wedged run + re-dispatches
  issues: write    # #2149: create/comment/close the deploy-wedge-alert throttle marker

jobs:
  watch:
    name: Detect a wedged deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # #3315: this job used to run the runner's SYSTEM python with nothing installed.
      # `--head-coverage-check` below parses ci-cd.yml's `paths:` filter through PyYAML on
      # the `uncovered` branch — the one branch where its verdict matters. Without PyYAML
      # the import raised inside diagnose_uncovered_head's try/except, `ci_paths` fell back
      # to [] ("could not read the filter" ⇒ everything matches), and every docs-only push
      # with a sibling workflow run would have paged as a SWALLOWED push — the naive
      # "uncovered ⇒ page" behaviour the header above says would be muted inside a week,
      # reached by a missing import instead of a design choice. Declare the interpreter and
      # the one dependency (setup-ci installs no packages — #3234). Still no AWS.
      - uses: ./.github/actions/setup-ci

      - name: Install PyYAML (the head-coverage `paths:` filter parser)
        run: |
          PINS=$(python3 scripts/ci_pins.py pyyaml)   # version from requirements-dev.txt (CQ-01)
          pip install --quiet $PINS

      - name: Classify the in-flight deploy state
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/check_deploy_wedge.py --threshold "${{ github.event.inputs.threshold || '10' }}" --alert | tee verdict.txt
        continue-on-error: true

      - name: Recover a confirmed phantom wedge
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.recover == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --recover refuses to act on any verdict other than a confirmed phantom wedge.
          python3 scripts/check_deploy_wedge.py --threshold "${{ github.event.inputs.threshold || '10' }}" --recover

      # #3021's superseded-lease janitor ran here as a step from 2026-08-30 to 2026-09-04.
      # It now lives in its own workflow, deploy-gate-janitor.yml (#3422): it needs a
      # `concurrency:` group so an event-triggered sweep and a cron sweep cannot dispose the
      # same lease at once, and THIS workflow must never own one (see the header + the
      # #2052 test). The two stay disjoint by predicate: the janitor requires a non-empty
      # pending_deployments; the phantom-wedge class has it empty by definition.

      - name: Fail loudly on a wedge
        if: steps.classify.outcome == 'failure'
        run: |
          echo "::error title=Deploy wedge or stranded gate::CI/CD's deploy path is not progressing — see the decode below."
          {
            echo "## 🛑 CI/CD deploy path is not progressing"
            echo
            echo '```'
            cat verdict.txt
            echo '```'
            echo
            echo "(the last line of the block above is the #2149 alert-throttle outcome — "
            echo "\`alert-fired\` means the curated remediation-agent email is on its way; "
            echo "\`alert-throttled\` means this episode already paged once.)"
            echo
            echo "Escape hatch: re-run this workflow via **Run workflow** with \`recover: true\`,"
            echo "or locally: \`python3 scripts/check_deploy_wedge.py --recover\`."
            echo
            echo "Background: \`docs/CONVENTIONS.md\` §4d (five recurrences and what was tried each time)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check main's HEAD has CI/CD coverage (#2826)
        id: head_coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # #2746: the default runner shell is `bash -e {0}` — a nonzero exit from the
          # piped command below would otherwise abort the script on THIS line and
          # `code=$?` would never run. `set +e` is the same deliberate, recognized
          # opt-out ci-cd.yml's own cdk-diff step uses for the identical reason: this
          # step captures-and-forwards the verdict, it is not itself the gate — the two
          # steps below are, keyed on the exact code this one writes to $GITHUB_OUTPUT.
          set +e
          python3 scripts/check_main_green.py --head-coverage-check | tee head_coverage_verdict.txt
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Fail loudly on a swallowed push (#2826)
        if: steps.head_coverage.outputs.code == '1'
        run: |
          echo "::error title=Swallowed push (#2826)::main's HEAD minted ZERO CI/CD-relevant workflow runs — this is NOT an expected path-filter skip."
          {
            echo "## 🛑 Swallowed push — main's HEAD has no CI/CD coverage"
            echo
            echo '```'
            cat head_coverage_verdict.txt
            echo '```'
            echo
            echo "This was proven to be the GENUINE #2662 shape, not the DEVOPS-01 path-filter-skip"
            echo "shape ci-cd.yml's own \`paths:\` block documents (a docs-only/handover-only push is"
            echo "expected to skip ci-cd.yml and stays silent here — see #2826)."
            echo
            echo "Recovery: \`gh workflow run ci-cd.yml --ref main -f deploy_all=true\` (or re-push) so"
            echo "HEAD earns a real CI/CD verdict."
            echo
            echo "Background: #2826, #2762, #2662."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Flag an indeterminate head-coverage read (#2826)
        if: steps.head_coverage.outputs.code == '2'
        run: |
          echo "::error title=Head-coverage check could not verify (#2826)::an API read failed or the commit's changed files were unreadable — this is NOT a confirmed swallowed push."
          {
            echo "## ⚠️ Head-coverage check ran but could not reach a verdict"
            echo
            echo '```'
            cat head_coverage_verdict.txt
            echo '```'
            echo
            echo "The #2753 class this epic exists to close: an execution error must never read as"
            echo "'coverage OK'. It is ALSO not a confirmed swallow — decode manually before assuming"
            echo "an incident: \`python3 scripts/check_main_green.py --head-coverage-check\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
