# Deploy dead-man + head coverage — main's deploy path watched from OUTSIDE ci-cd.yml.
#
# #4256 box 3 (ADR-158): this file was the #2052 phantom-wedge watch. ADR-158 moved the
# production gate off the code `deploy` job, so the wedge classifier and the lease janitor
# were retired (scripts/check_deploy_wedge.py retired with its `--recover` and #2149 alert;
# deploy-gate-janitor.yml retired) into ONE deploy dead-man — the last
# step below, which alarms on ANY green run on main that has not deployed within its
# deadline. A wedged Deploy is such a run, so the wedge class is still caught, at the
# dead-man's deadline instead of a 10-minute threshold. The filename is kept: the
# cron-freshness registry, the dark-flag sweep and the gate census key on it.
#
# WHY THIS IS A SEPARATE WORKFLOW, NOT A JOB IN ci-cd.yml: it has to observe ci-cd.yml
# from OUTSIDE — a job in a later ci-cd run would queue behind the very deploy group it
# is watching. NO `concurrency:` BLOCK HERE, DELIBERATELY: a watchdog for a stuck queue
# must not own a queue (tests/test_deploy_wedge_2052.py). It holds no AWS credentials
# and never deploys; a red scheduled run is the repo's "email the owner" channel.
#
# SCHEDULED HEAD-COVERAGE CHECK (#2826): `scripts/check_main_green.py::head_coverage()`
# (#2762) detects the swallowed-push shape — a push to main that mints ZERO CI/CD runs —
# but until this step it only ever ran inside a session's `/wrap` gate, so an unattended
# merge (dependabot-automerge, remediation automerge) whose push was swallowed had no
# detector until a human happened to run it. This cron is the natural scheduled home:
# read-only, no AWS, same "red scheduled run pages the owner" channel as the dead-man
# below. `--head-coverage-check` was built to tell a GENUINE swallow apart from an
# ORDINARY path-filter skip (ci-cd.yml's `paths:` filter declining a docs-only or
# handover-only push — e.g. HEAD 8cbf075f read `uncovered` while `Docs CI` ran at it).
# Since #3378 (2026-09-01) ci-cd.yml has NO `paths:` filter — every push to main mints a
# run — so the parsed filter is empty, every changed path "matches", and an `uncovered`
# HEAD now reads as a genuine swallow. The path-filter-skip branch stays for the day a
# filter returns (check_main_green names that as a likely cause). Three-way exit
# code (0 OK / 1 CONFIRMED swallow / 2 indeterminate — an API read failed, so neither
# verdict was provable) so the check itself cannot fail dark (#2753 class): both 1 and 2
# fail this job, with visibly DIFFERENT step names and step-summary content, so an
# operator glancing at the run instantly knows "swallowed push, page" from "the check
# broke, decode manually" rather than reading one red run as the other.

name: Deploy dead-man

on:
  schedule:
    # Declared every 15 minutes — GitHub does NOT deliver that cadence (#3237 disposition
    # item 1). Measured n=99 gaps (2026-08-23..27): declared cron: */15 = 0.25h; min
    # 0.26h, median 0.71h, mean 0.83h, p90 1.18h, max 6.99h — the declared cadence held
    # in 0 of 99 intervals. A LATER sweep (n=60, 2026-08-26..09-05) found gaps up to 729
    # min (12.15h). The 2026-08-02 recurrence that motivated the original "15 minutes
    # bounds the blind window" comment was cancelled at 17 minutes holding a stale sha —
    # but that comment stated a guarantee GitHub has never once kept, and
    # scripts/check_cron_freshness.py's own STALE-vs-healthy verdict for this workflow
    # briefly inverted on it (#3541, #3237 disposition item 3): the true blind window is
    # bounded by the MEASURED worst gap (re-derived live from the Actions API every run,
    # scripts/scheduled_workflow_registry.py's grace_hours is a floor under it), not by
    # the declared `*/15`.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write  # read run/job state; also required to POST repos/.../dispatches (the dead-man's urgent_alarm)
  issues: write    # the dead-man's one `deploy-deadman` tracking issue

jobs:
  watch:
    name: Deploy dead-man + head coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # #3315: this job used to run the runner's SYSTEM python with nothing installed.
      # `--head-coverage-check` below parses ci-cd.yml's `paths:` filter through PyYAML on
      # the `uncovered` branch — the one branch where its verdict matters. Without PyYAML
      # the import raised inside diagnose_uncovered_head's try/except, `ci_paths` fell back
      # to [] ("could not read the filter" ⇒ everything matches), and every docs-only push
      # with a sibling workflow run would have paged as a SWALLOWED push — the naive
      # "uncovered ⇒ page" behaviour the header above says would be muted inside a week,
      # reached by a missing import instead of a design choice. Declare the interpreter and
      # the one dependency (setup-ci installs no packages — #3234). Still no AWS.
      - uses: ./.github/actions/setup-ci

      - name: Install PyYAML (the head-coverage `paths:` filter parser)
        run: |
          PINS=$(python3 scripts/ci_pins.py pyyaml)   # version from requirements-dev.txt (CQ-01)
          pip install --quiet $PINS

      - name: Check main's HEAD has CI/CD coverage (#2826)
        id: head_coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # #2746: the default runner shell is `bash -e {0}` — a nonzero exit from the
          # piped command below would otherwise abort the script on THIS line and
          # `code=$?` would never run. `set +e` is the same deliberate, recognized
          # opt-out ci-cd.yml's own cdk-diff step uses for the identical reason: this
          # step captures-and-forwards the verdict, it is not itself the gate — the two
          # steps below are, keyed on the exact code this one writes to $GITHUB_OUTPUT.
          set +e
          python3 scripts/check_main_green.py --head-coverage-check | tee head_coverage_verdict.txt
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Fail loudly on a swallowed push (#2826)
        if: steps.head_coverage.outputs.code == '1'
        run: |
          echo "::error title=Swallowed push (#2826)::main's HEAD minted ZERO CI/CD-relevant workflow runs — this is NOT an expected path-filter skip."
          {
            echo "## 🛑 Swallowed push — main's HEAD has no CI/CD coverage"
            echo
            echo '```'
            cat head_coverage_verdict.txt
            echo '```'
            echo
            echo "This was proven to be the GENUINE #2662 shape, not a path-filter skip (ci-cd.yml"
            echo "carries no \`paths:\` filter since #3378, so every push to main should mint a run —"
            echo "see #2826)."
            echo
            echo "Recovery: \`gh workflow run ci-cd.yml --ref main -f deploy_all=true\` (or re-push) so"
            echo "HEAD earns a real CI/CD verdict."
            echo
            echo "Background: #2826, #2762, #2662."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Flag an indeterminate head-coverage read (#2826)
        if: steps.head_coverage.outputs.code == '2'
        run: |
          echo "::error title=Head-coverage check could not verify (#2826)::an API read failed or the commit's changed files were unreadable — this is NOT a confirmed swallowed push."
          {
            echo "## ⚠️ Head-coverage check ran but could not reach a verdict"
            echo
            echo '```'
            cat head_coverage_verdict.txt
            echo '```'
            echo
            echo "The #2753 class this epic exists to close: an execution error must never read as"
            echo "'coverage OK'. It is ALSO not a confirmed swallow — decode manually before assuming"
            echo "an incident: \`python3 scripts/check_main_green.py --head-coverage-check\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # ADR-158 (#4256): THE deploy dead-man. Code now ships on green with no approval gate,
      # so the one question left is whether what main merged actually reached AWS: a green
      # CI/CD run on main whose Deploy failed, was cancelled, was skipped behind a failed or
      # rejected IAM gate, or is still parked/running past the deadline, and not superseded
      # by a later fleet deploy. Exit 1 = alarm, 2 = the API was unreadable (never OK);
      # --alert keeps one `deploy-deadman` issue in step and fires `urgent_alarm` once per
      # episode. LAST step + `!cancelled()`: a red head-coverage step above must not
      # skip it, and it must not skip them.
      - name: Deploy dead-man — main's green runs reached AWS (#4256)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_deploy_deadman.py --alert
