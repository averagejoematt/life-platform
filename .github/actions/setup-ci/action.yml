name: 'Setup CI'
description: >-
  Shared CI setup — the copy-pasted "setup-python + configure-aws-credentials (OIDC)"
  pair, factored into one place with the action SHAs pinned identically to every
  hand-rolled call site it replaces (#1655). Toggle each step with the inputs below.

  NOTE — checkout is deliberately NOT here. A LOCAL composite action (referenced as
  `./.github/actions/setup-ci`) can only be resolved after `actions/checkout` has already
  populated the workspace, so the bootstrapping checkout must stay in the caller. Its
  params (`ref`, `fetch-depth`) also vary per job. Callers keep their own checkout step
  and then call this action.

inputs:
  python:
    description: "Run actions/setup-python. Set 'false' for AWS-creds-only jobs."
    required: false
    default: 'true'
  python-version:
    description: 'Python version passed to actions/setup-python.'
    required: false
    default: '3.12'
  python-cache:
    description: "actions/setup-python `cache` value (e.g. 'pip'). Empty disables caching (the setup-python default)."
    required: false
    default: ''
  aws-role:
    description: 'IAM role ARN to assume via OIDC. Empty (the default) skips AWS credential configuration entirely.'
    required: false
    default: ''
  aws-region:
    description: 'AWS region for configure-aws-credentials.'
    required: false
    default: 'us-west-2'

runs:
  using: 'composite'
  steps:
    # Same SHA as every hand-rolled call site (v7.0.0) — do not bump here in isolation.
    - name: Set up Python
      if: ${{ inputs.python == 'true' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.python-cache }}

    # Same SHA as every hand-rolled call site (v6.2.2). OIDC auth — the calling job
    # must grant `permissions: { id-token: write, contents: read }`; this action can't
    # widen the caller's token.
    - name: Configure AWS credentials (OIDC)
      if: ${{ inputs.aws-role != '' }}
      uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: ${{ inputs.aws-region }}
