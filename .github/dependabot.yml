# Dependabot — automated dependency-update PRs (2026-06-09, Tier-1 hardening).
# Actions are SHA-pinned; Dependabot bumps the SHA + version comment for us.
# Lambda *source* is stdlib-only, but three binary *layers* (pillow/garth/lameenc) ship
# third-party code into running Lambdas — those are version-pinned in
# lambdas/requirements/ and CVE-scanned by the scheduled pip_audit_lambda (#1336), not by
# Dependabot (which can't resolve a binary Lambda layer). Here only the dev + CDK
# toolchains are Dependabot-tracked.
version: 2
updates:
  # GitHub Actions — keep the SHA-pinned actions current + patched.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # Dev/test toolchain (requirements-dev.txt: ruff, black, mypy, pytest, …).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-dev)"
    groups:
      dev-tooling:
        patterns: ["*"]
    ignore:
      # A black or ruff bump that REFORMATS code is a deliberate "reformat the whole
      # repo" event, not a routine auto-bump: the format gate is blocking, so the bump
      # and the reformat have to land together or the next push is red-walled. So
      # ignore ruff/black minor+major here; patch bumps still flow.
      #
      # NB the old second half of this rationale ("pinned in BOTH requirements-dev.txt
      # AND inline in ci-cd.yml … silently drifts `make format` from CI") is obsolete
      # since #2609: there is no second copy any more. Every workflow resolves its
      # versions from requirements-dev.txt via scripts/ci_pins.py, so a bump moves the
      # local gate and CI in lockstep by construction. The reformat-coupling reason
      # above is the one that still holds.
      - dependency-name: "ruff"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "black"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Remediation-agent toolchain, npm leg (remediation/package.json:
  # @anthropic-ai/claude-code — #2759). The workflow resolves the CLI version from
  # that manifest at install time, so this bump moves the ONLY copy (the #2609
  # one-copy pattern, npm shape). Before this leg existed the CLI installed
  # UNPINNED — floating to whatever released today in a scheduled job holding
  # OIDC creds and a PR-writing token, with no automated bumper (#2468 class).
  - package-ecosystem: "npm"
    directory: "/remediation"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-remediation)"

  # CDK toolchain (cdk/requirements.txt: aws-cdk-lib, constructs).
  - package-ecosystem: "pip"
    directory: "/cdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-cdk)"

  # CDK CLI (cdk/package.json: aws-cdk) — the npm leg of the CDK toolchain (#2760).
  # The pip leg is above; ci-cd.yml resolves the CLI version from cdk/package.json
  # at install time, so this bump moves the ONLY copy (no born-red hand-edit —
  # the #2609 pattern). Before this leg existed the CLI pin sat months stale
  # behind a "bump it by hand" comment (#2468 incident, fix PR #2751).
  - package-ecosystem: "npm"
    directory: "/cdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-cdk)"
